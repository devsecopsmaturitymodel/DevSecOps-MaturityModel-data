    Automated data leak detection for AI interactions:
      uuid: 8d5ce64e-ebf0-45ab-93cb-d592287e3023
      description: |-
        Technical controls (e.g. AI gateways/proxies, secret scanners on prompts,
        DLP filters) automatically detect and block sensitive data such as secrets,
        access tokens and personal data before it is sent to external AI services.

        Typical setup: route all model traffic through an LLM gateway (e.g.
        LiteLLM Proxy) and attach scanners as guardrail hooks, such as
        Presidio for PII redaction and LLM Guard or trufflehog-style secret
        detectors for credentials. Commercial alternatives with managed AI-DLP include
        Nightfall AI, Prompt Security, Lakera Guard and the GenAI-DLP features
        of CASB/SSE platforms (e.g. Netskope, Zscaler).
      risk: |-
        Policies and awareness alone do not prevent accidental leaks. A single pasted
        production credential or customer data set in a prompt can lead to a
        compromise or a privacy violation.
      measure: |-
        Route traffic to external AI services through a gateway that scans prompts
        and attachments for secrets and personal data, blocks or redacts findings
        and provides an audit trail of AI tool usage.
      dependsOn:
      - dc62d384-0b9c-47d9-b7a5-9d82e53642ba # Basic data leak prevention
      assessment: |
        - Show the gateway or proxy through which traffic to external AI services flows and its scanner configuration.
        - Demonstrate that a test secret or test personal data in a prompt is blocked or redacted.
        - Show the audit trail of AI tool usage.
      difficultyOfImplementation:
        knowledge: 3
        time: 3
        resources: 3
      usefulness: 4
      level: 4
