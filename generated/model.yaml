  Consolidation:
    Simple false positive treatment:
      uuid: c1acc8af-312e-4503-a817-a26220c993a0
      description: "Security tests may produce false positives (or _\"false alarms\"_),
        findings that are incorrectly identified as vulnerabilities.\n\nIt is important
        distinguish these from true positive vulnerabilities to avoid wasting time
        and resources on non-issues.\n\nFalse positive treatment ensures that findings
        from security tests are triaged and documented, allowing teams to distinguish
        between real vulnerabilities and false positives. This reduces unnecessary
        work and helps maintain focus on true risks.\n\nSome positive findings might
        be considered an _accepted risk_ by the organization. This must also be documented.\n\nAI
        can support triage as a complementary tool: a language model with access to
        the finding and the surrounding code can assess reachability and exploitability
        in context, propose a triage verdict with reasoning and draft the documentation
        of the decision. The human decision stays: AI verdicts are input to triage,
        not a substitute for it \u2014 a wrongly auto-closed true positive is exactly
        the risk this activity exists to prevent.\n"
      risk: |
        If false positives are not managed, teams may ignore all findings, leading to real vulnerabilities being overlooked and increasing the risk of exploitation. Specially, if tests are automated an run daily.
      measure: |
        Findings from security tests must be triaged and outcomes persisted/documented to:
          - Prevent re-analysis of known issues in subsequent test runs
          - Track accepted risks vs false positives
          - Enable consistent decision-making across teams

        At this maturity level, a simple tracking system suffices - tools need only distinguish between "triaged" and "untriaged" findings, without complex categorization. Some tools refer to this as "suppression" of findings.

        Samples for false positive handling:
          - [OWASP Dependency Check](https://jeremylong.github.io/DependencyCheck/general/suppression.html)
          - [Kubescape with VEX](https://kubescape.io/blog/2023/12/07/kubescape-support-for-vex-generation/)
          - [OWASP DefectDojo Risk Acceptance](https://docs.defectdojo.com/en/working_with_findings/findings_workflows/risk_acceptances/) and [False Positive Handling](https://docs.defectdojo.com/en/working_with_findings/intro_to_findings/#triage-vulnerabilities-using-finding-status)
      assessment: |
        A process is defined for triaging and documenting false positives and accepted risks
      level: 1
      difficultyOfImplementation:
        knowledge: 1
        time: 1
        resources: 1
      usefulness: 4
      implementation:
