    Drift detection for deployed configuration:
      uuid: 9cba815f-02d2-4b06-a11f-7f28580e135a
      description: "Deployment pipelines put an approved, versioned state into production
        \u2014\ndrift detection continuously verifies that production still matches
        it.\nDeployed infrastructure and configuration can be changed past the\npipeline:
        through a quick hotfix, direct console or shell access, or a\ncompromised
        automation account. Continuously comparing the running\nstate against the
        versioned desired state (e.g. GitOps reconciliation,\ninfrastructure-as-code
        plan diffs) detects such out-of-band changes."
      risk: "Production is modified outside the deployment process \u2014 a manual\nhotfix,
        a console change or an attacker altering configuration. The\nrunning state
        no longer matches the reviewed, versioned state:\nhardening is silently loosened
        and never restored, the repository\ngives a false sense of the deployed reality,
        and rebuilding the\nenvironment reproduces neither the fix nor the compromise
        analysis."
      measure: |-
        Continuously compare the deployed state of infrastructure and
        configuration against the versioned desired state (e.g. via GitOps
        controllers that reconcile and report drift, or scheduled
        infrastructure-as-code plan runs). Alert on every deviation and either
        revert it automatically to the approved state or bring the change
        through the regular review process. Document intentional exceptions
        so the alerts stay actionable.
      dependsOn:
      - 67e1a9aa-9fbf-4ec5-a2de-400f01960c51 # Automated deployment process
      assessment: |
        - Show the drift detection mechanism (e.g. GitOps reconciliation status or scheduled plan diffs) and the covered environments.
        - Demonstrate that an out-of-band change to production configuration raises an alert or is reverted automatically.
        - Show how the last drift finding was handled (automatic revert or formal re-approval) and the documented exceptions.
      difficultyOfImplementation:
        knowledge: 3
        time: 2
        resources: 2
      usefulness: 4
      level: 3
      implementation:
