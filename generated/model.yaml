    Drift detection for agent instructions and guardrails:
      uuid: 30e29dfc-2bb8-4fe1-bc7e-b3a9ade1ee9e
      description: |-
        _Protection of agent memory against poisoning_ puts system prompts,
        rule files and guardrail configurations under version control and
        review. Drift detection continuously verifies that what runs in
        production still matches the approved state. Deployed instructions
        and guardrails can be changed past the review process: through a
        quick hotfix, direct console access, a compromised pipeline or an
        agent writing to its own configuration. Comparing hashes of the
        normalized deployed content against the last approved repository
        version detects such silent changes. The generic detection of
        configuration drift in production is defined in _Drift detection for
        deployed configuration_ (Build and Deployment). This activity
        extends it to the content assets that determine agent behavior.
      risk: |-
        A system prompt or guardrail configuration is modified outside the
        review process (by an attacker, by an agent altering its own
        instructions or by a well-meant manual hotfix). The deployed agent
        behaves differently from the reviewed state, loosened guardrails are
        never tightened again ("configuration drift") and nobody notices,
        because the repository still looks correct.
      measure: |-
        Compare the deployed state of agent instructions (system prompts,
        rule files) and guardrail configurations against the last approved
        repository version on a schedule (at every deployment and at least
        daily) using hashes of normalized content. Alert on every deviation,
        treat drift of instructions or guardrails as a security incident with
        high priority, and either restore the approved version or formally
        re-approve the change. Document known runtime transformations as
        normalization exceptions to keep the false-positive rate low.
      dependsOn:
      - 106622af-8969-4d9b-81ad-86d8e2bfd631 # Protection of agent memory against poisoning
      - 9cba815f-02d2-4b06-a11f-7f28580e135a # Drift detection for deployed configuration
      assessment: |
        - Show the drift detection mechanism (hash comparison of normalized content), its schedule and the covered assets (system prompts, rule files, guardrail configurations).
        - Demonstrate that an out-of-band change to a deployed system prompt or guardrail raises an alert within the scan cycle.
        - Show how the last drift alert was handled (restore or formal re-approval) and the documented normalization exceptions.
      difficultyOfImplementation:
        knowledge: 3
        time: 2
        resources: 2
      usefulness: 4
      level: 5
      tags:
      - ai
      - verification
      implementation:
      - uuid: bbaf5f6a-0366-488b-a712-7f915e866135
        name: Agent Identity Governance Framework (AIGF)
        tags:
