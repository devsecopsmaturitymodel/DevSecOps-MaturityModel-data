        description: |-
          System-design walkthrough of an AI coding agent CLI (Claude Code / Codex):
          permission engine with blast-radius split, allow/deny rules, OS-level
          sandbox with default-deny egress, and treating repo content (including
          agent memory files) as untrusted data.
