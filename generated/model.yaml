        description: |-
          Open-source governance layer that wraps LLM clients in-process and
          evaluates deterministic policies before and after every model call:
          guardrails (prompt injection, personally identifiable information (PII)
          and secret detection), cost budgets per request, session and day with
          circuit breakers, behavioral baselines with kill switch, and a
          tamper-evident audit trail with correlation identifiers.
