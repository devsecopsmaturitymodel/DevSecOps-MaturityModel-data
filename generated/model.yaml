    Conduction of advanced threat modeling:
      uuid: ae22dafd-bcd6-41ee-ba01-8b7fe6fc1ad9
      risk: Inadequate identification of business and technical risks.
      measure: Threat modeling is performed by using reviewing user stories and producing
        security driven data flow diagrams.
      difficultyOfImplementation:
        knowledge: 4
        time: 3
        resources: 2
      usefulness: 3
      level: 4
      dependsOn:
      - 47419324-e263-415b-815d-e7161b6b905e # Conduction of simple threat modeling on technical level
      - dd5ed7c1-bdbf-400f-b75f-6d3953a1a04e # Creation of threat modeling processes and standards
      description: |
        **Example High Maturity Scenario:**

        Based on a detailed threat model defined and updated through code, the team decides the following:

        * Local encrypted caches need to expire and auto-purged.
        * Communication channels encrypted and authenticated.
        * All secrets persisted in shared secrets store.
        * Frontend designed with permissions model integration.
        * Permissions matrix defined.
        * Input is escaped output is encoded appropriately using well established libraries.

        Source: OWASP Project Integration Project
        # AI support
        At this maturity level, AI can lift threat modeling from periodic workshops to a continuous activity: AI threat modeling tools generate architecture-aware threat model drafts from feature tickets and design documents before implementation starts, re-run the analysis when new tickets arrive and compare the threat model against the implemented code to surface drift between design intent and implementation (e.g. Apiiro AI Threat Modeling, commercial). The generated models require expert review, see the note on failure modes in _Conduction of simple threat modeling on technical level_.
