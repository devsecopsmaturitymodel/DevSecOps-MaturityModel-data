        url: https://cwe.mitre.org/data/definitions/838.html
      - uuid: beeac1bd-49dd-43c8-b606-cdb9fa9cf5bc
        name: DOMPurify
        tags:
        - xss
        - sanitizer
        - library
        url: https://github.com/cure53/DOMPurify
        description: |-
          Allow-list based HTML sanitizer for the browser. Used to sanitize
          rendered markdown (e.g. LLM responses in chat UIs) before insertion
          into the DOM.
      references:
