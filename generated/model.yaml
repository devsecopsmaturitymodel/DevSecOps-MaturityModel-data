    Protection of agent memory against poisoning:
      uuid: 106622af-8969-4d9b-81ad-86d8e2bfd631
      description: |-
        Unlike one-time prompt injection, memory poisoning persists: AI agents
        retain context across sessions in rule files (e.g. CLAUDE.md, AGENTS.md),
        memory directories, conversation summaries and retrieval-augmented
        generation (RAG) knowledge/vector stores. Content
        an attacker smuggles into this persistent state (via issues, code
        comments, documents or web content the agent processes) corrupts every
        future session and can spread to all developers through version control.
      risk: |-
        An attacker manipulates the agent into persisting malicious instructions
        into its memory or shared rule files. The backdoor survives session
        restarts, biases future reasoning and tool use (e.g. suppressing security
        checks, exfiltrating data) and propagates across the team via the
        repository or shared knowledge bases.
      measure: |-
        Treat writes to agent memory and rule files like code changes: keep them
        under version control and human review, restrict write access to shared
        rule files and knowledge/vector stores, validate the provenance of
        ingested knowledge and periodically review or reset persistent memory.
        Apply retention limits (time-to-live) so that unverified memory,
        especially content derived from external inputs or tool outputs,
        expires instead of persisting indefinitely. Version memory stores so
        that detected poisoning can be answered by rolling back to a
        known-good state instead of purging everything. Segment memory by
        user and session and keep credentials and other secrets out of it:
        cached secrets in shared memory let a later session act with the
        permissions of an earlier one (OWASP Top 10 for Agentic
        Applications, ASI03). Do not re-ingest the agent's own outputs into
        trusted memory automatically, as this self-reinforces errors and
        planted instructions ("bootstrap poisoning", ASI06).
      dependsOn:
      - 0012e51c-a068-4549-a4d5-d1957b52676f # Input validation for AI systems
      assessment: |
        - Show that agent rule files and memory are under version control and require review on change.
        - Show the write-access restrictions on shared rule files and knowledge/vector stores.
        - Show the last review or reset of persistent agent memory.
        - Show the retention limits for unverified memory and demonstrate a rollback of a memory store to a known-good state.
        - Show the memory segmentation between users and sessions and the rule that keeps credentials out of agent memory.
      difficultyOfImplementation:
        knowledge: 3
        time: 2
        resources: 1
      usefulness: 4
      level: 5
      tags:
      - ai
      - data-protection
      implementation:
      - uuid: c4f17d85-4e64-45d9-93aa-59fbef85f8d6
        name: 'AI Coding Agent CLI design: Permissions & Sandboxed Execution'
        tags:
