        - 7.2.2
        iso27001-2022:
        - Security champions are missing in ISO 27001 most likely
        - 5.4
        - 6.3
        openCRE:
        - https://www.opencre.org/node/standard/DevSecOps%20Maturity%20Model%20%28DSOMM%29/section/Education%20and%20Guidance/subsection/Each%20team%20has%20a%20security%20champion
