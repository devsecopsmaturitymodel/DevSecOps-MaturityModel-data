    Human review of AI generated code:
      uuid: d6bc0b7f-fd98-49fe-b66c-7c5fa70452c6
      description: |-
        AI-generated code is plausible-looking by construction and often accepted
        without scrutiny ("automation bias"). It must be treated like code from an
        untrusted contributor: a human with knowledge of the codebase reviews it
        before it is merged. The upstream reviews of specification and plan
        (_Human review of AI generated specifications_, _Human review of AI
        generated plans_) reduce what code review must catch, and the
        automated gates (_Self-verification of AI generated changes_, _Static
        and dynamic analysis of AI generated code_) filter mechanical
        findings. Neither replaces this activity: agents deviate from
        approved plans, so the code remains the last artifact gate before
        merge.
      risk: |-
        AI-generated code containing subtle logic flaws, insecure defaults or
        hallucinated/typo-squatted dependencies is merged unreviewed because it
        "looks right" and compiles.
      measure: |-
        Require human review for all AI-generated changes before merge. Reviewers are
        accountable for the change as if they had written it. AI agents must not be
        able to approve or merge their own pull requests.
      dependsOn:
      - 45f722b2-25b4-472a-a743-f7207a77b5c9 # Least privilege on external systems for AI agents
      assessment: |
        - Show branch protection requiring human review before merge and that agent identities cannot approve or merge their own pull requests.
        - Show recent reviews of AI-generated changes and who is accountable for them.
      difficultyOfImplementation:
        knowledge: 2
        time: 3
        resources: 1
      usefulness: 5
      level: 3
      tags:
      - ai
      - verification
      - human-review
