  Red Teaming:
    Basic AI red teaming:
      uuid: b4233919-6de0-4ed3-b7da-3bdd91c8db5e
      description: |-
        AI-based features (e.g. chat bots, agents, retrieval-augmented
        generation (RAG) systems) have attack surfaces
        that classic penetration tests do not cover, such as prompt injection,
        jailbreaks, insecure output handling and excessive agency. Manual AI red
        teaming probes these weaknesses before release.
      risk: |-
        AI features go live without being tested against AI-specific attacks. An
        attacker uses prompt injection or jailbreaks to bypass restrictions, trigger
        unauthorized actions or extract confidential data from the model context.
      measure: |-
        Perform manual AI red teaming for AI-based features before their initial
        release, covering at least the OWASP Top 10 for LLM Applications
        (e.g. prompt injection, insecure output handling, sensitive information
        disclosure, excessive agency).
      assessment: |
        - Show the scope and findings of the last manual AI red teaming session for an AI-based feature.
        - Show that findings were triaged and fixed (e.g. tickets and their resolution).
