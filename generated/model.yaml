  Guidance:
    Static load of security rules:
      uuid: 51ebc877-c4fd-4b50-9305-320152242ddf
      description: |-
        AI coding assistants follow instructions provided in rule files
        (e.g. system prompts, repository instruction files such as CLAUDE.md,
        AGENTS.md or .github/copilot-instructions.md). Providing an organization-wide
        baseline of secure coding rules steers generated code towards secure defaults.

        Adding a few rules to automated imported files like `CLAUDE.md` works. This might blow up the context.
      risk: |-
        Without explicit secure coding instructions, AI assistants reproduce insecure
        patterns from their training data, e.g. string-concatenated SQL queries,
        disabled certificate validation, hardcoded secrets or missing input validation.
      measure: |-
        Define and roll out a baseline secure coding rule set for AI assistants
        covering topics like input validation, output encoding, parameterized queries,
        secret handling and usage of evaluated components (e.g. images, libraries).
      assessment: "- Show the secure coding rule set for AI assistants.\n- Show a
        sample of project that the rules are loaded automatically (e.g. via `CLAUDE.md`).
        \       \n"
