    Human approval for irreversible AI agent actions:
      uuid: cd1cb2bd-4bd6-4b9f-beaa-921fe9ea9576
      description: |-
        Agent actions differ vastly in blast radius: reading data is harmless,
        transferring money is not. Graduated human oversight assigns every
        class of agent action an approval tier based on its reversibility:
        low-risk, reversible actions run autonomously within guardrails;
        reversible actions with business impact run under monitoring with an
        intervention window; irreversible actions (financial transactions,
        permission changes, sharing data with third parties, outbound
        communication) require explicit human approval before execution,
        high-risk ones by two independent people (four-eyes principle).
        Whereas _Permission management for AI agents_ governs the agent's
        tool-level permission model, this activity governs the business
        actions an agent performs through those tools. It completes the
        human-oversight ladder started by the artifact reviews
        (_Human review of AI generated specifications_, _Human review of
        AI generated plans_, _Human review of AI generated code_ in
        Verification): those gate what is built, this activity gates what
        a running agent does.
      risk: |-
        A manipulated (e.g. via prompt injection) or malfunctioning agent
        performs an action that cannot be rolled back: money is transferred,
        data reaches a third party, an e-mail is sent, permissions are
        escalated. After-the-fact monitoring cannot undo it. The opposite
        failure mode is rubber-stamping: approvals nobody actually reads
        create the appearance of oversight without any. Attackers exploit
        this deliberately. A manipulated agent justifies a harmful action
        with a fabricated but plausible rationale, and the approver waves
        it through because the agent appears competent (automation bias,
        see OWASP Top 10 for Agentic Applications, ASI09).
      measure: |-
        Classify agent action types by reversibility and assign approval
        tiers: pre-approval for irreversible actions, monitoring with an
        intervention window for reversible actions with business impact
        (e.g. buffer outbound messages for a defined period so an
        intervention stops delivery), autonomy only for low-risk reversible
        actions. If the reversibility of an action class cannot be
        demonstrated, default to pre-approval. Require a second, independent
        approver for high-risk actions, record the approver identity, the
        decision context and the reason in the audit log, and design the
        approval step so the approver actually sees the action and its
        context instead of clicking through.
      dependsOn:
      - 4a618049-19da-4e20-b933-81f203ecd4d2 # Permission management for AI agents
      - 84ba7525-857e-4849-98ba-5fada1a1454d # Audit logging of AI agent actions
      assessment: |
        - Show the classification of agent action types by reversibility and the approval tier assigned to each class.
        - Demonstrate that an irreversible action (e.g. an outbound message or a permission change) is blocked until a human approves it, and that an intervention within the monitoring window stops a buffered action.
        - Show a high-risk action with two documented, independent approvals.
