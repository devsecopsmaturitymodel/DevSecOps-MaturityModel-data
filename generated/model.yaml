    Dynamic load of security rules:
      uuid: 862d08a4-7299-4b2c-9d38-8fcaade66d3e
      description: |-
        In spec-driven development, AI-assisted work is split into explicit steps
        (e.g. specify, plan, implement, review). Model context is limited: loading
        all security guidance at once dilutes it, loading it at the wrong step
        means it is absent when needed. Security artifacts are therefore assigned
        to the step where they are effective: security requirements and abuse
        cases during specification, threat model results during planning, secure
        coding rules during implementation, review checklists during verification.

        Two ways to bind security artifacts to workflow steps, using Spec Kit
        with Claude Code as example:

        1. **Extend the step templates**: add the security artifact references
           directly to the phase templates (e.g. `.specify/templates/`). Simple,
           but the changes live inside the tool's files and must be re-applied
           after tool updates.
        2. **Hook that detects the step command** (update-safe and automatic):
           a `UserPromptSubmit` hook fires on every prompt, checks which
           workflow command was invoked and injects the matching file as
           `additionalContext`. The tool's templates stay untouched and the
           step-to-artifact mapping lives in one central place:

           ```bash
           #!/bin/bash
           input=$(cat)
           prompt=$(jq -r '.prompt // empty' <<<"$input")

           case "$prompt" in
             /speckit.plan*)      file="specs/threat-model.md" ;;
             /speckit.implement*) file="docs/secure-coding-rules.md" ;;
             /speckit.review*)    file="docs/security-review-checklist.md" ;;
             *) exit 0 ;;
           esac

           jq -nc --arg ctx "$(cat "$file")" \
             '{hookSpecificOutput: {hookEventName: "UserPromptSubmit",
               additionalContext: $ctx}}'
           ```

           Registered in `.claude/settings.json` under `hooks`, the mapping is
           versioned with the repository, survives Spec Kit updates and cannot
           be forgotten by developers. Keep the injected artifacts small and
           step-specific: the goal is the right rules in context, not all
           rules.
      risk: |-
        Security rules exist but are not in the model context at the step where
        the AI assistant needs them, or the context is flooded with irrelevant
        rules so the model ignores them. Generated specifications, plans and code
        silently drop security requirements between steps.
      measure: |-
        Structure AI-assisted development workflows so that each step loads its
        relevant security artifacts into the model context (e.g. via step-specific
        instruction templates in spec-driven development). Verify that security
        requirements from the specification are carried through plan,
        implementation and review steps.
      dependsOn:
      - 51ebc877-c4fd-4b50-9305-320152242ddf # Static load of security rules
      - 1caad69c-316c-422a-a56b-04ad6f6cc306 # Threat modeling rule
      - 923a2a23-d63b-421c-926a-191d1dd5f570 # Spec-driven development
      assessment: |
        - Show the mapping of security artifacts to workflow steps (step templates or hook configuration).
        - Demonstrate that the matching security artifact is loaded into the model context when a workflow step is invoked.
      difficultyOfImplementation:
        knowledge: 4
        time: 2
        resources: 1
      usefulness: 4
      level: 4
      tags:
      - ai
      - guidance
