    Inventory of AI agents:
      uuid: c1f02ad7-e97e-4c87-b827-7542793ddb0a
      description: |-
        Classic IAM was built for humans; AI agents multiply faster than any
        human workforce and are easy to spin up unnoticed. An inventory records
        every AI agent and assistant in use (its identity, owner, purpose,
        permissions and connected systems) and is the precondition for
        governing them.
      risk: |-
        "Shadow agents" run without anyone being accountable: agents started by
        individual developers or teams keep credentials and access long after
        their purpose ended, and nobody can answer which agents exist, what they
        may do and who owns them. This makes incident response and offboarding
        impossible.
      measure: |-
        Maintain an inventory of all AI agents and assistants: identity/service
        account, human owner, purpose, granted permissions and connected
        systems. Review it periodically, decommission stale agents and detect
        unregistered ones (e.g. via identity provider and audit log analysis).
      dependsOn:
      - a511a9a9-1b75-4dfd-8a4f-e516e8096150 # AI usage policy
      assessment: |
        - Show the inventory of AI agents with identity, human owner, purpose and granted permissions.
        - Show the last periodic review and an example of a decommissioned agent.
        - Explain how unregistered ("shadow") agents are detected, e.g. via identity provider or audit log analysis.
      difficultyOfImplementation:
        knowledge: 2
        time: 2
        resources: 1
      usefulness: 4
      level: 2
      tags:
      - ai
      - guidance
      - inventory
      implementation:
