    Alerting:
      uuid: 8a442d8e-0eb1-4793-a513-571aef982edd
      description: |
        # AI support
        Two numbers decide whether an alert queue works: how long an anomaly
        stays unnoticed before a person looks at it, and what share of the
        incoming alerts gets investigated at all. AI can improve both (see
        Anthropic's eBook _Zero Trust for AI Agents_): give a triage
        assistant read-only access to the monitoring data and let it write a
        structured first assessment for every alert, so analysts start with
        the alerts that actually need human judgement. Introduce it
        incrementally: choose a single rule that is known to generate mostly
        false positives, let the model handle its alert stream for a trial
        period while a human independently assesses the same alerts, compare
        the two, and only then move on to the next rule. The assistant
        prepares evidence, correlation and documentation; decisions about
        containment and disclosure remain with humans.
      risk: Incidents are discovered after they happened.
      measure: |
        Thresholds for metrics are set. In case the thresholds are reached, alarms are send out. Which should get attention due to the critically.
      difficultyOfImplementation:
        knowledge: 2
        time: 5
        resources: 5
      usefulness: 5
      level: 2
      dependsOn:
      - ded39bcf-4eaa-4c5f-9c94-09acde0a4734 # Visualized metrics
      implementation:
      - uuid: 7c0749f8-080d-46cf-a8bb-4c2f8a2c25f2
        name: Zero Trust for AI Agents
        tags:
        - ai
        - documentation
        url: https://claude.com/blog/zero-trust-for-ai-agents
        description: |-
          Free eBook by Anthropic applying Zero Trust principles (never trust,
          always verify; assume breach; least privilege and least agency) to
          agentic AI deployments: current threats to agentic systems, three
          capability tiers for agent identity, access control, observability,
          behavioral monitoring, input and output controls and recovery, an
          eight-phase implementation workflow and defensive operations at the
          speed of autonomous threats. Introduces the design test "does this
          control make the attack impossible, or just tedious?".
      references:
        samm2:
        - O-IM-A-2
        - I-DM-A-3
        iso27001-2017:
        - 16.1.2
        - 16.1.4
        - 12.1.4
        iso27001-2022:
        - 6.8
        - 5.25
        - 8.31
        openCRE:
        - https://www.opencre.org/node/standard/DevSecOps%20Maturity%20Model%20%28DSOMM%29/section/Monitoring/subsection/Alerting
      comments: ""
      tags:
      - none
