AI:
  Data Protection:
    Basic data leak prevention:
      uuid: dc62d384-0b9c-47d9-b7a5-9d82e53642ba
      description: |-
        Data shared with AI tools (prompts, attached files, repository content) may
        leave the organization and may be stored or used for model training by the
        provider. Basic data leak prevention defines what may be shared with which
        tool and uses contractual and technical provider settings to protect it.
      risk: |-
        Developers paste secrets, personal data or confidential source code into AI
        tools. The data is processed by third parties, potentially stored, used for
        training or leaked in a provider breach.
      measure: |-
        Define which data classes may be used with which AI tools. If a commercial AI is used, use AI
        offerings with training opt-out and data retention agreements. Train
        employees to keep secrets and personal data out of prompts.
      dependsOn:
      - a511a9a9-1b75-4dfd-8a4f-e516e8096150 # AI usage policy
      assessment: |
        - Show the definition of which data classes may be used with which AI tools.
        - Show the enterprise agreements or provider settings (training opt-out, data retention).
        - Show the training or awareness material that tells employees to keep secrets and personal data out of prompts.
      difficultyOfImplementation:
        knowledge: 2
        time: 2
        resources: 1
      usefulness: 4
      level: 2
      tags:
      - ai
      - data-protection
      implementation:
