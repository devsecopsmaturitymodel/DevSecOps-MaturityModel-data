    Static and dynamic analysis of AI generated code:
      uuid: 10362082-f48f-4218-be08-4ab78e589df0
      description: |-
        Static and dynamic security testing (SAST, DAST, software composition
        analysis) is defined in the _Test and Verification_ dimension and is
        author-agnostic. This activity references those activities for
        AI-generated code instead of duplicating them. The AI-specific delta
        is coverage and pace: AI agents produce code in places classic scan
        scopes miss (generated infrastructure code, scripts, one-off tools)
        and at a rate that makes scanning inside the development loop (e.g.
        the agent running the static analysis itself during
        self-verification) more important than for human-written code.
        Complementary: _No verification bypass for AI generated code_ ensures
        no delivery path skips these scans.
      risk: |-
        AI-generated code reproduces insecure patterns from training data at
        scale. If static and dynamic analysis does not cover all AI-produced
        artifacts, typical vulnerabilities (injection, insecure defaults,
        hardcoded secrets) ship unnoticed, faster and in higher volume than
        with human-written code.
      measure: |-
        Apply the established static and dynamic security analysis to all
        AI-generated code and artifacts. Include AI-produced infrastructure
        code and scripts in the scan scope and surface findings inside the
        AI-assisted development loop, so agents can fix them before human
        review.
      dependsOn:
      - 6c05c837-8c99-46e2-828b-7c903e27dba4 # Static analysis for important server side components
      - 07796811-37f9-467c-9ff2-48f346e77ff3 # Simple Scan
      assessment: |
        - Show that the scan scope includes AI-produced artifacts such as generated infrastructure code and scripts.
        - Show a recent AI-generated change where static analysis findings were surfaced and fixed inside the AI-assisted development loop.
      difficultyOfImplementation:
        knowledge: 2
        time: 2
        resources: 2
      usefulness: 4
      level: 2
