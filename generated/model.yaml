    Audit logging of AI agent actions:
      uuid: 84ba7525-857e-4849-98ba-5fada1a1454d
      description: |-
        AI agents act autonomously at machine speed and delegate work to other
        agents. An audit log for agent actions records the causal chain of
        every action: who or what triggered it, which data sources and tools
        were used with which parameters, what was produced, which policy
        decision allowed it and which human approved it. This keeps every
        agent action attributable to a human principal, even across
        multi-agent chains.
      risk: |-
        Agent actions cannot be reconstructed or attributed: when an agent (or
        a chain of agents) performs a harmful action, neither the trigger, nor
        the decision basis, nor the approval status can be determined.
        Incident response, accountability and regulatory evidence (e.g. EU AI
        Act logging obligations) fail, and an attacker or insider can modify
        local logs unnoticed to cover their tracks.
      measure: |-
        Log every agent action in a structured audit log covering the causal
        chain: initiator, request, used data sources, tool calls with
        parameters, generated output, policy decision, delegation context and
        human approval. Propagate correlation identifiers across agents and
        systems (e.g. via OpenTelemetry traces) so multi-agent chains stay
        reconstructable, store the log tamper-evident (e.g. hash chaining,
        write-once storage) with a defined retention period, and protect the
        log itself: it contains sensitive prompts and outputs, so restrict
        access and redact where possible.
      dependsOn:
      - c1f02ad7-e97e-4c87-b827-7542793ddb0a # Inventory of AI agents
      - fe875e17-ae4a-45f8-a359-244aa4fcbc04 # Centralized application logging
      assessment: |
        - Show the structured audit log entry of a recent agent action including initiator, tool calls with parameters, data sources and (where required) the human approval.
        - Demonstrate that a multi-agent chain can be reconstructed end-to-end via correlation identifiers.
        - Show the tamper protection (e.g. hash chain verification) and the retention configuration of the audit log.
        - Show who has access to the audit log and how sensitive content in it is protected (e.g. redaction).
      difficultyOfImplementation:
        knowledge: 3
        time: 3
        resources: 2
      usefulness: 4
      level: 3
      tags:
      - ai
      - guidance
      - logging
      implementation:
