      uuid: 6c05c837-8c99-46e2-828b-7c903e27dba4
      description: "Static application security testing (SAST) analyzes source code
        for\nvulnerabilities, classically via string matching algorithms and/or\ndataflow
        analysis. In addition to these rule-based scanners, AI can\nbe used as a complementary
        analysis tool: AI-assisted code review\nand agentic analysis pipelines (e.g.
        the Visa Vulnerability Agentic\nHarness) reason about code semantics, perform
        threat-model-aware\ndeep dives and can verify findings to reduce false positives.\nAI-based
        analysis complements deterministic scanners rather than\nreplacing them \u2014
        its results are non-deterministic and coverage is\nnot guaranteed."
