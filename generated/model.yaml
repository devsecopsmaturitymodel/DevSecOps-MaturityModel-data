        tags:
        - deployment
        url: https://fluxcd.io/
        description: |-
          GitOps controller for Kubernetes that continuously reconciles the
          cluster state against the versioned desired state in Git. Out-of-band
          changes are detected as drift and automatically reverted or reported.
      - uuid: 0d63f907-37fe-4375-88a5-a5e252732618
