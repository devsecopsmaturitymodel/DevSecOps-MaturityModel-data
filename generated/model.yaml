    Network isolation for AI agents:
      uuid: 951e6090-057b-4dc4-8b4f-18c6adcfc1ab
      description: |-
        Restricting the network egress of AI agent environments prevents data
        exfiltration and the download of malicious tooling in case an agent is
        hijacked through prompt injection.

        Example for a coding agent like Claude Code running in a container:

        1. **Firewall inside the container**: on container start, an init script
           running with the `NET_ADMIN` capability configures a default-deny
           egress policy (iptables) and resolves an allow-list of required
           domains into an ipset: model API (e.g. `api.anthropic.com`), package
           registries (e.g. `registry.npmjs.org`) and the source code management
           system. Anthropic's reference devcontainer ships this as
           `init-firewall.sh`. The agent process runs as a non-root user
           afterwards, so it cannot alter the firewall rules it is confined by.
        2. **Alternative, egress proxy**: attach the container to an internal
           network without direct internet access (e.g.
           `docker network create --internal`) and route traffic through a
           filtering HTTP(S) proxy (`HTTPS_PROXY` environment variable) that
           enforces the domain allow-list and logs all requests. In Kubernetes,
           enforce the same with NetworkPolicies or a service mesh egress
           gateway.
        3. **DNS**: allow DNS only to the internal resolver and only for
           allow-listed domains, otherwise blocked domains remain reachable via
           direct IP or DNS tunneling can be used for exfiltration.
        4. **Verify**: from inside the running container, check that a request
           to an allow-listed endpoint succeeds and a request to an arbitrary
           host (e.g. `curl https://example.com`) is blocked.

        Isolation-conscious design pays a double dividend: forcing all agent
        traffic through one enforced egress point (firewall or proxy) creates
        a monitored bottleneck. Attacks that would otherwise be invisible
        must pass through it, which is a high-leverage place for detection
        (see the Google DeepMind AI Control Roadmap).
      risk: |-
        A prompt-injected AI agent can exfiltrate source code, secrets or personal
        data to arbitrary hosts, or download and execute attacker-controlled payloads.
      measure: |-
        Limit network access of AI agent environments to an allow-list of required
        endpoints (e.g. model API, package registries, source code management system).
        Deny all other egress traffic by default.
      dependsOn:
      - 4debe8ea-f54a-4a00-a1cb-6fad9e571a88 # Usage of sandboxing for AI agents
      assessment: |
        - Show the egress policy of the agent environment (firewall init script, proxy configuration or network policies) including the domain allow-list.
        - Demonstrate from inside the agent environment that an allow-listed endpoint is reachable and a request to an arbitrary host is blocked.
        - Show where blocked egress attempts are logged and who reviews them.
      difficultyOfImplementation:
        knowledge: 3
        time: 3
        resources: 2
      usefulness: 4
      level: 3
      tags:
      - ai
      - isolation
      implementation:
