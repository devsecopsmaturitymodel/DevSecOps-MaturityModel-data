    Input validation for AI systems:
      uuid: 0012e51c-a068-4549-a4d5-d1957b52676f
      description: |-
        Everything that enters a model context is input: user prompts, but
        also documents retrieved via retrieval-augmented generation (RAG),
        web content, source code, issues and tool results. Prompt injection prevention treats all of it as untrusted data
        and validates or constrains it before the model processes it.
      risk: |-
        Attacker-controlled content (e.g. a hidden instruction in a retrieved
        document, web page or code comment) is interpreted as an instruction by the
        model. The attacker overrides the system prompt, extracts confidential
        context or triggers unintended tool calls ([indirect prompt injection](https://genai.owasp.org/llmrisk/llm01-prompt-injection/#:~:text=triggers%20unexpected%20behavior).-,Indirect%20Prompt%20Injections,-Indirect%20prompt%20injections)).
      measure: |-
        Validate and constrain all input entering the model context: separate
        instructions from data in prompt templates, sanitize or annotate untrusted
        content, restrict input length and format where possible and use guardrail
        filters that detect known injection patterns before the model call.
      assessment: |
        - Show prompt templates that separate instructions from untrusted data.
        - Show the guardrail or filter configuration applied before the model call and a test where a known injection pattern is detected.
      difficultyOfImplementation:
        knowledge: 4
        time: 3
        resources: 2
      usefulness: 5
      level: 3
      tags:
      - ai
      - data-protection
      - input-validation
