    No verification bypass for AI generated code:
      uuid: c548df0b-0964-4fad-9f98-28fcd7442011
      description: |-
        Automated security testing of source code and running applications (SAST,
        DAST, SCA) is defined in the _Test and Verification_ dimension and applies
        to all code regardless of its author. This activity does not duplicate those
        activities; it ensures AI-generated code cannot reach production on a path
        that skips them (e.g. agent-pushed commits, auto-merge bots, generated
        infrastructure code outside the pipeline).
      risk: |-
        AI agents and code generation workflows introduce alternative paths to
        production (direct pushes, auto-merges, generated artifacts) that bypass the
        established SAST/DAST/SCA gates, so AI-generated vulnerabilities are never
        scanned.
      measure: |-
        Enforce that every AI-generated change goes through the same defined build
        and security testing pipeline as human-written code. Verify branch
        protection and pipeline gates cannot be bypassed by agent identities.
      dependsOn:
      - f6f7737f-25a9-4317-8de2-09bf59f29b5b # Defined build process
