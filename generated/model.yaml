    Human review of AI generated specifications:
      uuid: 09307f26-bf34-49c2-828e-649130876978
      description: |-
        In AI-assisted development, human attention scales best at the
        specification level: one page of specification determines what all
        downstream artifacts (plans, code, tests) will contain, and an
        error here is multiplied into every one of them. Reviewing the
        specification the AI works from (a user story with acceptance
        criteria, or the specify-phase artifact in spec-driven development)
        catches wrong intent, missing security requirements and wrong
        assumptions before anything is generated. It is the first rung of
        the human-oversight ladder that continues with _Human review of AI
        generated plans_, _Human review of AI generated code_ and _Human
        approval for irreversible AI agent actions_ (Isolation).
      risk: |-
        An AI assistant implements exactly what an unreviewed specification
        says: missing authorization requirements, absent abuse cases and
        wrong assumptions are faithfully turned into plans, code and tests.
        Later code review rarely catches this, because reviewers check whether
        the code matches the specification, not whether the specification is
        right.
      measure: |-
        Require human review of the specification before AI-assisted
        implementation starts: are the security acceptance criteria complete,
        are scope and assumptions correct, is anything security-relevant
        missing? In spec-driven workflows, make this review the gate of the
        specify phase and keep the reviewed specification under version
        control.
      dependsOn:
      - 923a2a23-d63b-421c-926a-191d1dd5f570 # Spec-driven development
      assessment: |
        - Show a recent specification an AI assistant worked from and its documented human review before implementation started.
        - Show that the review checked the security acceptance criteria (e.g. review comments or a checklist).
        - In spec-driven workflows: show that the specify phase cannot be left without the review gate.
      difficultyOfImplementation:
        knowledge: 2
        time: 2
        resources: 1
      usefulness: 5
      level: 2
      tags:
      - ai
      - verification
      - human-review
      implementation:
