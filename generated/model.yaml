    Simple Scan:
      uuid: 07796811-37f9-467c-9ff2-48f346e77ff3
      description: "A simple dynamic scan tests the running application from the outside\nand
        gives fast feedback on basic weaknesses such as missing security\nheaders
        or known misconfigurations. In addition to classic dynamic\napplication security
        testing (DAST) scanners, AI can complement\ndynamic testing: agentic penetration
        testing tools (e.g. XBOW,\nPentestGPT) explore the running application, chain
        findings and\nverify exploitability similar to a human tester. As with static\nanalysis,
        AI-based testing complements deterministic scanners rather\nthan replacing
        them \u2014 results are non-deterministic and coverage is\nnot guaranteed."
      risk: Deficient security tests are performed. Simple vulnerabilities are not
        detected and missing security configurations (e.g. headers) are not set. Fast
        feedback is not given.
      measure: A simple scan is performed to get a security baseline. In case the
        test is done in under 10 minutes, it should be part of the build and deployment
        process.
