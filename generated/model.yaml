    AI usage policy:
      uuid: a511a9a9-1b75-4dfd-8a4f-e516e8096150
      description: |-
        An AI usage policy defines which AI tools and models are approved, for which
        tasks they may be used, which data may be shared with them and how
        AI-generated output has to be handled (e.g. mandatory review).
      risk: |-
        Without a policy, employees use arbitrary AI tools ("shadow AI") with unknown
        data handling, share confidential information with them and ship unreviewed
        AI-generated code.
      measure: |-
        Define, communicate and enforce a policy for the usage of AI tools during
        development, including an approval process for new tools and models.
      assessment: |
        - Show the published AI usage policy including approved tools, allowed data classes and handling rules for AI-generated output.
        - Show the approval process for new tools and models with a recent example.
        - Show how the policy is communicated to employees (e.g. onboarding, training).
