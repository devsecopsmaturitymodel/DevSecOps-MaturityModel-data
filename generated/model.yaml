    Trust boundaries between AI agents:
      uuid: abe74dfd-d554-4ec5-8b94-f75d352afaaa
      description: |-
        In multi-agent systems, agents delegate tasks to other agents, and
        the trust relationships between them are dynamic and often implicit.
        Two failure modes dominate (OWASP Top 10 for Agentic Applications,
        ASI03):
        - Unscoped privilege inheritance: a delegating agent hands its
          complete permissions down to a subagent whose task requires only
          a fraction of them.
        - Confused deputy: an attacker who controls a weakly privileged
          agent routes plausible requests through a strongly privileged
          one. The receiving agent executes them because they arrive from
          a familiar peer, and nobody checks the original intent.

        Explicit trust boundaries treat every delegation like an external
        request. The receiving agent verifies the identity and
        authorization of the delegating agent instead of trusting the
        chain. The messages between agents need the same protection as the
        delegation itself: without mutual authentication, message signing
        and replay protection, an attacker can spoof or replay agent
        messages and register fake agents in the discovery mechanism
        (ASI07, Insecure Inter-Agent Communication). Splitting a large
        agent into several smaller ones compartmentalizes risk only if
        each agent has its own identity and credentials. Shared
        credentials undo the compartmentalization. _Least privilege on
        external systems for AI agents_ scopes each agent's access to
        external systems; this activity scopes the trust between the
        agents themselves.
      risk: |-
        An attacker compromises one low-privilege agent (e.g. via prompt
        injection) and pivots through delegation: higher-privileged agents
        accept its requests unchecked, inherited access contexts carry full
        permissions into subtasks, and the attacker reaches systems the
        initially compromised agent could never access directly.
      measure: |-
        Give every agent its own identity and its own credentials, never
        shared between agents. Scope each delegated task to the minimum
        permissions it needs instead of passing on the delegating agent's
        access context. Check at every step of a multi-agent workflow that
        the delegating agent is who it claims to be and is authorized to
        request the action. Secure the communication channel itself with
        mutual authentication and signed messages (e.g. mutual TLS),
        replay protection (e.g. nonces and expiry times) and rejection of
        protocol downgrades. Accept agents into a workflow only from a
        registry or discovery mechanism that verifies agent identity and
        descriptors. Record the communication between agents so that
        delegations deviating from the usual patterns surface for review
        (see _Audit logging of AI agent actions_ and _Anomaly detection
        for AI agent behavior_).
      dependsOn:
      - 45f722b2-25b4-472a-a743-f7207a77b5c9 # Least privilege on external systems for AI agents
      - 84ba7525-857e-4849-98ba-5fada1a1454d # Audit logging of AI agent actions
      assessment: |
        - Show that each agent in a multi-agent workflow has its own identity and credentials (no shared credentials).
        - Show how a delegated task receives a reduced permission scope instead of the delegating agent's full access context.
        - Demonstrate that a delegation from an unauthorized or unknown agent is rejected.
        - Show how inter-agent messages are authenticated and protected against replay, and that a message from an unregistered agent or a protocol downgrade is rejected.
        - Show how inter-agent communication is logged and how unusual delegation patterns are flagged.
      difficultyOfImplementation:
        knowledge: 4
        time: 3
        resources: 2
      usefulness: 4
      level: 4
      tags:
