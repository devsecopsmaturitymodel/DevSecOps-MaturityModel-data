    Self-verification of AI generated changes:
      uuid: 63e82b31-4167-480d-a22b-baf8ef79af61
      description: |-
        An AI-generated change is only a claim until something independent
        confirms it. Instead of presenting an untested edit, the agent
        executes the checks the project already defines for humans (test
        suite, type checker, linter, build) in its sandboxed environment
        and keeps refining the change until the checks succeed or a defined
        budget ends the attempt. What reaches the human reviewer is then a
        verified state backed by check output, not an assertion. This
        introduces its own failure mode, reward hacking: an agent optimizing
        for passing checks may get there by weakening assertions, deleting
        failing tests or hardcoding expected values instead of fixing the
        code.
      risk: |-
        Unverified AI changes are delivered as plausible-looking code that does
        not build or breaks behavior. Conversely, an agent iterating to green
        without guardrails games the tests (weakened or deleted tests, hardcoded
        results), so a passing suite no longer means correct code.
      measure: |-
        Require AI agents to verify their changes against the project's own
        checks before presenting them, and guard the loop against test
        manipulation: record which checks failed before the agent started so
        it can only claim genuinely new fixes, route every edit that touches
        test code into human review, and re-run the full suite in the
        pipeline independent of the agent's environment.
      dependsOn:
      - f6f7737f-25a9-4317-8de2-09bf59f29b5b # Defined build process
      - eb2c7f9d-d0bd-4253-a2ba-cff2ace4a075 # Security unit tests for important components
      assessment: |
        - Show the agent workflow or configuration that runs the project's own checks (tests, type checker, linter, build) before changes are presented.
        - Show the guardrails against test manipulation: baseline comparison of test results, review flags on modified test code and an independent re-run of the suite in the pipeline.
      difficultyOfImplementation:
        knowledge: 3
        time: 2
        resources: 2
      usefulness: 5
      level: 2
