    Test for compromised components:
      uuid: 9c776b4e-5895-4040-b63b-c74236ec71b3
      description: "Software composition analysis detects components with known\nvulnerabilities;
        compromised components are a different threat:\nlegitimate packages that ship
        malware after a maintainer account or\nbuild pipeline was hijacked. Supply
        chain attacks like the\nself-replicating Shai-Hulud npm worm (2025) published
        hundreds of\ncompromised package versions that stole credentials at install
        time \u2014\nfaster than vulnerability feeds and manual review can react."
      risk: |-
        A compromised version of a legitimate dependency executes malicious
        code during installation or build, steals credentials (package
        registry tokens, cloud keys) and propagates further before any CVE is
        published. Classic vulnerability scanning does not detect it.
      measure: |-
        Consume dependencies exclusively through a managed artifact repository
        and check components against malware and compromise intelligence:
        block or quarantine known-compromised versions (e.g. packages affected
        by Shai-Hulud) at the artifact repository, enforce a cooldown period
        for newly published versions and react to compromise advisories by
        purging affected artifacts from caches and rebuilding.
      dependsOn:
      - f6f7737f-25a9-4317-8de2-09bf59f29b5b # Defined build process
      - d918cd44-a972-43e9-a974-eff3f4a5dcfe # Software Composition Analysis (server side)
      difficultyOfImplementation:
        knowledge: 2
        time: 2
        resources: 2
      usefulness: 4
      level: 3
      implementation:
      - uuid: 70da74e9-806d-4db4-b3a7-9c5717060ed8
        name: OpenSSF Malicious Packages
        tags:
        - supply-chain
        - sca
        - documentation
        url: https://github.com/ossf/malicious-packages
        description: |-
          Open database of reported malicious and compromised open source
          packages in OSV format. Usable as a blocklist feed for artifact
          repositories and dependency scanners.
      - uuid: e511975e-cad2-45e7-9b1e-9441da889407
        name: Sonatype Repository Firewall
        tags:
        - supply-chain
        - sca
        - commercial
        url: https://www.sonatype.com/products/sonatype-repository-firewall
        description: |-
          Policy engine in front of an artifact repository that quarantines
          known-malicious, compromised and suspicious package versions before
          they enter the internal repository.
      - uuid: 5d8b27ac-286e-47a5-b23f-769eb6d74e4a
        name: packj
        tags:
        - OpenSource
        - Supply Chain
        - vulnerability
        url: https://github.com/ossillate-inc/packj
        description: |
          Packj is a tool to detect software supply chain attacks. It can detect malicious, vulnerable, abandoned, typo-squatting, and other "risky" packages from popular open-source package registries, such as NPM, RubyGems, and PyPI.
      references:
        samm2:
        - V-ST-A-2
        - I-SB-B-2
        iso27001-2017:
        - 12.6.1
        - 15.1.1
        iso27001-2022:
        - 8.8
        - 5.19
        openCRE:
        - https://www.opencre.org/node/standard/DevSecOps%20Maturity%20Model%20%28DSOMM%29/section/Static%20depth%20for%20applications/subsection/Test%20for%20compromised%20components
      tags:
      - sca
      - supply-chain
