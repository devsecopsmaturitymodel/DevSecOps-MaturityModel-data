    Logging of AI interactions:
      uuid: 053ca80e-c2e7-4ec6-8a6d-2879187df357
      description: |-
        AI agents and assistants act with delegated authority: their prompts,
        tool and command invocations and outputs are security-relevant events.
        Centralized logging of AI interactions provides the audit trail needed
        to investigate incidents, detect misuse (e.g. prompt-injection-driven
        actions, data exfiltration) and observe drift in agent behavior.
      risk: |-
        Actions performed by AI agents are not recorded or cannot be
        distinguished from human actions. Misuse, data leaks and rogue agent
        behavior go undetected and cannot be investigated after an incident.
      measure: |-
        Log AI interactions centrally: prompts, tool/command invocations, used
        model versions and resulting actions, attributed to dedicated agent
        identities. Feed the logs into the existing security monitoring and
        alert on anomalies (e.g. unusual repositories, mass file access,
        activity at odd hours).
      dependsOn:
      - fe875e17-ae4a-45f8-a359-244aa4fcbc04 # Centralized application logging
      assessment: |
        - Show where AI interactions (prompts, responses, tool calls) are logged and which fields are captured.
        - Show that the logs are integrated into centralized logging with appropriate retention and access restrictions.
      difficultyOfImplementation:
        knowledge: 3
        time: 3
        resources: 2
      usefulness: 4
      level: 3
      tags:
      - ai
      - logging
      implementation:
      - uuid: f2966f4c-38b2-4dbf-95a4-6f0a8fc15ae3
        name: Google DeepMind AI Control Roadmap
        tags:
        - ai
        - monitoring
        - threat
        - documentation
        url: https://storage.googleapis.com/deepmind-media/DeepMind.com/Blog/securing-the-future-of-ai-agents/gdm-ai-control-roadmap.pdf
        description: |-
          Roadmap for controlling potentially misaligned AI agents. It treats
          agents as untrusted principals and layers system-level defences: the
          TRAIT&R threat taxonomy (based on MITRE ATT&CK),
          action/chain-of-thought monitoring, pull-request monitoring, UEBA
          anomaly detection, honeypots and tiered prevention/response up to
          shutdown infrastructure.
      - uuid: bbaf5f6a-0366-488b-a712-7f915e866135
        name: Agent Identity Governance Framework (AIGF)
        tags:
        - ai
        - isolation
        - permissions
        - logging
        - documentation
        url: https://labs.cloudsecurityalliance.org/agentic/agentic-identity-governance-framework-v1/
        description: |-
          Vendor-neutral framework (Richard Peddi, v2.1, CC BY 4.0) for identity,
          access and content governance of autonomous AI agents along six axes:
          identification (shadow agents), authentication, authorization,
          audit/non-repudiation (structured audit log with mandatory fields for
          the causal chain, correlation identifiers across multi-agent chains,
          tamper evidence via hash chaining and write-once storage),
          prompt injection prevention and data flow tracking. The framework is
          mapped to EU AI Act, GDPR, ISO 42001/27001 and NIST AI RMF.
      - uuid: 181e9b98-7d4f-4fff-9181-9f4c4408022e
        name: Anthropic Agent Identity and Access Model
        tags:
        - ai
        - isolation
        - permissions
        - documentation
        url: https://claude.com/blog/agent-identity-access-model
        description: |-
          Reference architecture for agent identity: agents act under dedicated
          workspace-level service accounts instead of user credentials, with scoped
          per-channel permissions, credentials injected at the network boundary,
          egress blocked to unapproved hosts and every agent action logged under
          the agent identity in both platforms' audit logs.
      - uuid: 415def4e-8562-45e3-a085-b7edd5eb4317
        name: 'AI Coding Agent CLI design: Background & Cloud Agents'
        tags:
        - ai
        - isolation
        - logging
        - documentation
        url: https://system-design-interviews.com/book/interview.html#ai-coding-cli/cloud
        description: |-
          System-design walkthrough of headless cloud agents: ephemeral sandboxes
          with short-lived single-repo tokens, deny-by-default egress, PR review as
