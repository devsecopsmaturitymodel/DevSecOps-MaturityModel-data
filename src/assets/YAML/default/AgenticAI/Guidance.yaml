      comments: ""
    Automated containment of anomalous AI agents:
      uuid: 3bbd6dd9-0821-426c-8a19-41737ed61459
      description: |-
        _Anomaly detection for AI agent behavior_ raises the signal; this
        activity determines how fast it is acted on. Compromised agents
        operate at machine speed: by the time a human has read the alert, an
        agent may have exfiltrated data in small portions or spread through
        delegated tasks. Automated containment executes pre-approved,
        narrowly scoped and reversible actions immediately, for example
        pausing the agent, terminating its sessions, revoking its
        short-lived credentials or reducing its privileges to a safe
        baseline. Far-reaching decisions remain with humans. The guiding
        principle: automate the bookkeeping (evidence collection,
        correlation, documentation of the incident), not the decisions
        (containment of business-critical systems, disclosure, customer
        communication). In multi-agent systems, containment also has to
        stop cascades: one faulty or compromised agent can trigger many
        downstream agents in a short time (OWASP Top 10 for Agentic
        Applications, ASI08).
      risk: |-
        An anomaly alert fires, but the response is manual: hours pass
        between detection and containment while the compromised agent keeps
        operating within its granted permissions. The damage window is
        defined by human reaction time instead of detection time, and the
        human spends that time collecting evidence instead of deciding.
      measure: |-
        Define an automated containment action per detection class and wire
        it to the anomaly detection: pause the agent, terminate its
        sessions, revoke its credentials or reduce its privileges. Keep the
        actions reversible and graduated by confidence and severity, log
        every automated action and notify a human immediately. Let an AI
        assistant draft the triage context (timeline, affected systems,
        collected evidence) so the notified human decides instead of
        collecting, and test the containment path regularly like a fire
        drill. Alert on cascade symptoms such as rapid fan-out (one
        decision triggers many downstream agents or tasks) and oscillating
        retry loops between agents, and place circuit breakers between
        planning and execution so that a runaway plan stops instead of
        propagating. Return a contained agent to production only after its
        instructions, memory and dependencies have been verified against a
        known-good state and a human has approved the reintegration.
      dependsOn:
        - 99049c0a-400f-4c58-986c-ab448ca8e0fc # Anomaly detection for AI agent behavior
        - 45f722b2-25b4-472a-a743-f7207a77b5c9 # Least privilege on external systems for AI agents
      assessment: |
        - Show the mapping of detection classes to automated containment actions and their graduation by confidence and severity.
        - Demonstrate in a test that an anomalously behaving agent is automatically paused or its credentials revoked, the action is logged and a human is notified.
        - Show the drafted triage context of a past or simulated incident and the human decision based on it.
        - Show the protocol of the last containment test.
        - Show the cascade guardrails (fan-out alerts, circuit breakers between planning and execution) and the reintegration protocol of a contained agent.
      difficultyOfImplementation:
        knowledge: 4
        time: 3
        resources: 2
      usefulness: 4
      level: 5
      tags:
        - ai
        - guidance
        - logging
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aigf
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aima
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/owasp-agentic-top-10
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/anthropic-zero-trust-agents
      references:
