      comments: ""
    Anomaly detection for AI agent behavior:
      uuid: 99049c0a-400f-4c58-986c-ab448ca8e0fc
      description: |-
        Audit logs record what agents do; anomaly detection turns those
        records into a signal while intervention is still possible. A
        compromised (e.g. prompt-injected) or malfunctioning agent typically
        stays within its granted permissions, so no single action is blocked.
        What changes is the pattern: tool-call frequency, data access
        volumes, targeted systems, activity times or failure rates deviate
        from the agent's normal behavior. This activity builds on _Audit
        logging of AI agent actions_ and feeds detections into the generic
        _Alerting_ (Information Gathering).
      risk: |-
        A manipulated or malfunctioning agent operates unnoticed for days
        within its permissions: it exfiltrates data in small portions, calls
        tools at abnormal frequency or accesses systems it never touched
        before. The audit log records everything, but nobody looks at it
        until the damage is done.
      measure: |-
        Define an expected behavior profile per AI agent (used tools, data
        volumes, action frequency, typical target systems) and detect
        deviations from it: start with rule-based thresholds (e.g. tool-call
        rate, data volume per time window, first-time access to a system),
        extend towards statistical or learning-based detection. Route
        detections into the existing alerting channel with a defined
        response, e.g. pause the agent or revoke its credentials, then
        investigate via the audit log.
      dependsOn:
        - 84ba7525-857e-4849-98ba-5fada1a1454d # Audit logging of AI agent actions
        - 8a442d8e-0eb1-4793-a513-571aef982edd # Alerting
      assessment: |
        - Show the expected behavior profile of an AI agent and the detection rules or models derived from it.
        - Demonstrate an alert for anomalous agent behavior (e.g. unusual tool-call frequency or first-time access to a system) and the defined response (e.g. pausing the agent, revoking credentials).
        - Show how a past alert was investigated using the audit log.
      difficultyOfImplementation:
        knowledge: 4
        time: 3
        resources: 2
      usefulness: 4
      level: 4
      tags:
        - ai
        - guidance
        - logging
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aigf
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aima
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/owasp-agentic-top-10
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/tealtiger
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/anthropic-zero-trust-agents
      references:
