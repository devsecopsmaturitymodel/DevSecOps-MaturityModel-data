      comments: ""
    Decommissioning of AI agents:
      uuid: 44a195ec-da9e-4fd4-be6d-a5a688852cf7
      description: |-
        The lifecycle of an AI agent does not end with switching it off.
        During operation an agent accumulates an identity, credentials,
        permissions, policies and integrations with other systems. Secure
        decommissioning unwinds all of them and preserves the audit evidence.
        The _Inventory of AI agents_ records what exists; this activity
        ensures that what is retired actually loses all access.
      risk: |-
        Shut-down agents leave residual access behind: service accounts and
        OAuth clients stay active, issued tokens remain valid, agent-specific
        permissions and policies persist, and registrations in dependent
        systems (message brokers, queues, caches, third-party software as a
        service integrations) keep working. An attacker takes over such an
        orphaned identity, and nobody notices because the agent is no
        longer monitored. Deleting its audit logs too early additionally
        destroys the evidence needed for investigations.
      measure: |-
        Define and enforce a decommissioning checklist that covers every
        access path: set the agent status in the inventory, revoke the agent
        identity and its certificates, deactivate associated service accounts
        and OAuth clients, remove or deny agent-specific permissions and
        policies, clean up dependent systems (broker registrations, message
        queue subscriptions, caches, stored sessions, third-party
        integrations, shadow credentials), archive the audit logs according
        to the retention requirements and verify after completion that no
        residual access remains.
      dependsOn:
        - c1f02ad7-e97e-4c87-b827-7542793ddb0a # Inventory of AI agents
        - 45f722b2-25b4-472a-a743-f7207a77b5c9 # Least privilege on external systems for AI agents
      assessment: |
        - Show the decommissioning checklist and the completed protocol of a recently retired agent (timestamp, reason, approver).
        - Demonstrate for a retired agent that its identity, credentials, permissions and registrations in dependent systems no longer grant access (zero residual access).
        - Show that the audit logs of the retired agent are archived according to the retention requirements.
      difficultyOfImplementation:
        knowledge: 2
        time: 2
        resources: 1
      usefulness: 4
      level: 3
      tags:
        - ai
        - guidance
        - inventory
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aigf
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-c05
      references:
        samm2:
          - O-EM-A-1
        iso27001-2017:
          - 9.2.6
        iso27001-2022:
          - 5.18
      comments: ""
    Instructed load of security rules:
      uuid: 364123db-b41c-431a-94a0-dfd8236b2daa
      description: |-
        The mapping of security artifacts to development steps is declared in
        the AI assistant's repository instruction file (e.g. `CLAUDE.md`,
        `AGENTS.md`): the assistant is instructed to read the matching
        artifact when a workflow step starts, e.g.:

        ```markdown
        ## Workflow rules
        - On /speckit.plan: read specs/threat-model.md first.
        - On /speckit.implement: read docs/secure-coding-rules.md first.
        ```

        Since the instruction file is loaded at session start, only the small
        step-to-artifact mapping is permanently in context; the artifacts
        themselves are loaded by the model on demand at the step where they
        are effective. This works across tools that read instruction files
        and requires no additional tooling.

        The approach is probabilistic: following the instruction is up to the
        model and can fail in long sessions, after context compaction or when
        many instructions compete. Deterministic, tool-enforced loading of
        the same mapping is covered by _Dynamic load of security rules_.
      risk: |-
        Security artifacts exist, but nothing tells the AI assistant when to
        load which artifact. Guidance is either loaded all at once and
        diluted, or missing at the step where it is needed, so generated
        plans and code silently drop security requirements.
      measure: |-
        Declare in the repository instruction file which security artifact
        the AI assistant reads at which workflow step (e.g. threat model
        during planning, secure coding rules during implementation) and
        verify in sample sessions that the artifacts are actually loaded.
      dependsOn:
        - 51ebc877-c4fd-4b50-9305-320152242ddf # Static load of security rules
        - 923a2a23-d63b-421c-926a-191d1dd5f570 # Spec-driven development
      assessment: |
        - Show the step-to-artifact mapping in the instruction file.
        - Show a session where the assistant loads the matching security artifact when a workflow step is invoked.
