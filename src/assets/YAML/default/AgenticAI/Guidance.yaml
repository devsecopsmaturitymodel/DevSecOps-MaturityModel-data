    Language and framework specific security rules:
      uuid: ac152a8d-2628-4db1-a7d6-6d75031bb40e
      description: |-
        Generic secure coding rules do not cover technology-specific pitfalls.
        Rule sets tailored to each language and framework in use (e.g. Spring,
        Django, React, Kubernetes manifests) make AI-generated code follow the
        organization's hardening guidelines for that technology.
      risk: |-
        AI assistants generate code that is generically "secure" but violates
        framework-specific best practices, e.g. disabling CSRF protection in Spring,
        unsafe deserialization in Python or dangerouslySetInnerHTML in React,
        because no technology-specific guidance is provided.
      measure: |-
        Create and maintain secure coding rule sets for every language and framework
        used in the organization and distribute them to all AI-assisted projects.
        Review the rules regularly and after security incidents.
        The rules are to be dynamically imported during the correct spec-driven
        development phase.
      dependsOn:
        - 51ebc877-c4fd-4b50-9305-320152242ddf # Basic secure coding rules for AI assistants
        - 923a2a23-d63b-421c-926a-191d1dd5f570 # Spec-driven development
      assessment: |
        - Show the rule sets for the languages and frameworks.
