    Threat modeling of AI components:
      uuid: 5a1cd6cd-ebd0-4e70-b314-37b8ab0b7d8d
      description: |-
        General threat modeling practices (how to run sessions, processes and
        standards) are defined in the _Culture and Organization_ dimension,
        subdimension _Design_. This activity only adds the AI-specific delta.
        AI components introduce elements classic threat models miss: the model
        context as a data flow that attackers reach via prompts, documents and
        tool results; agents and tool integrations as trust boundaries;
        retrieval-augmented generation (RAG) knowledge bases and training data
        as poisoning targets; model output as an injection vector. The subject
        here is the product: applications that contain AI components. Passing
        security requirements into AI-*assisted* implementation of arbitrary
        features is covered by _Security requirements for AI-assisted
        development_.

        A data-centric approach works well for the AI delta: follow the data
        (prompts, retrieved documents, tool results, training and evaluation
        data) through every transformation and storage point and model the
        threats along that flow, as described in the guidance of NIST SP
        800-154 (data-centric system threat modeling). Running only the
        generic checklist over an AI feature leaves these risks
        undiscovered, because the AI-specific data flows never appear in it.

        When evaluating mitigations, apply the design test from Anthropic's
        _Zero Trust for AI Agents_: "does this make the attack impossible,
        or just tedious?" Agentic attackers automate tedium away: they
        retry endlessly at almost no cost, so a control that only adds
        friction (a rate limit, one more network hop to pivot through, a
        non-standard port) loses its value. Favor controls that take a
        capability away entirely, such as a network path that simply does
        not exist or a credential that has already expired.
      risk: |-
        AI-specific threats such as prompt injection paths, excessive agency of tool-using agents,
        data leakage through the model context and poisoning of
        retrieval-augmented generation (RAG) sources
        remain unidentified and unmitigated.
      measure: |-
        Extend the established threat modeling practice to AI components: model
        the context window, tool integrations, agents and data sources explicitly
        and use AI-specific threat catalogs (e.g. OWASP Top 10 for LLM
        Applications, MITRE ATLAS) alongside the generic methodology. For
        agentic systems, the MAESTRO framework of the Cloud Security Alliance
        (CSA) structures threats along seven layers, from the foundation model
        to the agent ecosystem.
      dependsOn:
        - 47419324-e263-415b-815d-e7161b6b905e # Conduction of simple threat modeling on technical level
      assessment: |
        - Show a threat model of an AI feature that covers the model context, tool integrations, agents and data sources.
        - Show which AI-specific threat catalog (e.g. OWASP Top 10 for LLM Applications, MITRE ATLAS) was used and the resulting mitigations.
      difficultyOfImplementation:
        knowledge: 4
        time: 3
        resources: 1
      usefulness: 4
      level: 3
      tags:
        - ai
        - guidance
        - threat-modeling
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/google-saif
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/gdm-ai-control-roadmap
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-c09
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-c08
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/owasp-llm-top-10
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/owasp-agentic-top-10
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/mitre-atlas
