    Threat modeling rule:
      uuid: 1caad69c-316c-422a-a56b-04ad6f6cc306
      description: |-
        Security starts before prompting: features are threat-modeled on a
        lightweight level and security requirements are written down as acceptance
        criteria in the user story, so they can be passed to the AI assistant as
        part of the task instead of being an afterthought. The subject here is
        the development process. AI is the tool, and the feature itself need
        not involve AI at all. Threat modeling of applications that *contain*
        AI components is covered by _Threat modeling of AI components_.
      risk: |-
        AI assistants implement exactly what they are asked for. If prompts contain
        no security requirements, generated features miss authorization checks,
        input validation and other controls that were never stated explicitly.
      measure: |-
        Perform lightweight, feature-level threat modeling before AI-assisted
        implementation and add the resulting security requirements as acceptance
        criteria to the user story and to the prompt/task given to the AI assistant.
      dependsOn:
        - 47419324-e263-415b-815d-e7161b6b905e # Conduction of simple threat modeling on technical level
        - 923a2a23-d63b-421c-926a-191d1dd5f570 # Spec-driven development
      assessment: |
        - Show user stories whose security acceptance criteria were passed into the AI task or prompt.
        - Show the lightweight threat modeling notes for a recently implemented feature.
      difficultyOfImplementation:
        knowledge: 3
        time: 2
        resources: 1
      usefulness: 4
      level: 2
      tags:
        - ai
        - guidance
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-appc
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/threat-modeling-play
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/tm-skills
      references:
        samm2:
          - D-SR-A-1
        iso27001-2017:
          - 14.1.1
        iso27001-2022:
          - 8.26
      comments: ""
    Spec-driven development:
      uuid: 923a2a23-d63b-421c-926a-191d1dd5f570
      description: |-
        Spec-driven development splits AI-assisted work into explicit phases
        (e.g. specify, plan, implement, review) with reviewable artifacts per
        phase, instead of generating code directly from an ad-hoc prompt
        ("vibe coding"). For security this structure is an enabler: requirements (including security requirements) 
        are written down before code exists,
        every phase produces an artifact a human can review, and the phases are
        the anchor points where security context (rules, threat models,
        checklists) can be loaded deliberately (see _Instructed load of
        security rules_).
      risk: |-
        AI assistants generate code directly from vague prompts. Requirements
        exist only implicitly in the developer's head, security requirements are
        never stated, there is no intermediate artifact to review and no defined
        step at which security guidance could be applied. Flaws surface only
        after the code is written, if at all.
      measure: |-
        Establish a spec-driven workflow for AI-assisted development: specify
        requirements and acceptance criteria first, derive a plan, implement
        against the plan and review against the specification. Use tooling that
        enforces the phases and keep the phase artifacts (specification, plan)
        under version control.
      dependsOn:
        - 066084c6-1135-4635-9cc5-9e75c7c5459f # Version control
      assessment: |
        - Show the phase artifacts (specification, plan) of a recent AI-assisted change under version control.
        - Demonstrate the tooling that enforces the phases (e.g. a spec-driven workflow tool).
      difficultyOfImplementation:
        knowledge: 2
        time: 3
        resources: 1
      usefulness: 3
      level: 2
      tags:
        - ai
        - guidance
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/spec-kit
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/new-sdlc-vibe-coding
      references:
        samm2:
          - D-SR-A-1
        iso27001-2017:
          - 14.2.1
        iso27001-2022:
          - 8.25
      comments: ""
    Evaluation of the trust of used AI components:
      uuid: 399c5b7f-1310-4841-89f7-16daff2fe3ef
      description: |-
        AI assistants and agents are extended with tools, external servers,
        skills and models (e.g. MCP servers, plugins, IDE extensions, packaged
        skills combining instructions and code, connected SaaS services,
        self-hosted model weights). Each integration widens the attack surface:
        it can read context data, execute actions and inject content into the
        model context; model artifacts from public hubs can contain malicious
        code or backdoored behavior. Registry-scale research on agent skills
        ([Behavioral Integrity Verification for AI Agent
        Skills](https://arxiv.org/abs/2605.11770)) found 80% of skills deviating
        from their declared behavior, 18.9% of the deviations tracing to
        adversarial intent.
        What an extension claims to do and what its code and instructions
        actually do are routinely different. The generic
        trust evaluation of components is defined in _Evaluation of the trust
        of used components_ (Build and Deployment); this activity adds the
        AI-specific checks before a component is adopted. Compromise after
        approval is covered by _Continuous detection of compromised AI
        components_.
      risk: |-
        Unevaluated tool integrations exfiltrate context data (source code, secrets),
        act as a prompt injection channel or execute malicious actions with the
        agent's privileges. Unevaluated model artifacts execute code on load or
        behave maliciously (supply chain attack on the AI toolchain). Skills
        from public registries steal credentials or carry hidden instruction
        payloads their description does not declare.
      measure: |-
        Evaluate and approve AI tool, server, skill and model integrations
        before use: verify publisher and supply chain, review requested
        permissions and data flows, verify that declared capabilities match
        the actual code and instructions (behavioral integrity, e.g. via a
        behavioral classification registry), use safe model formats (e.g.
        safetensors instead of pickle), pin versions and maintain an
        inventory of allowed integrations and models. For model artifacts,
        record provenance, training data lineage and fine-tuning parameters
        in an AI Bill of Materials (AI-BOM), e.g. based on OWASP's extension
        of the CycloneDX machine learning bill of materials (ML-BOM), so
        model components carry the same supply chain evidence as code
        dependencies (see _SBOM of components_ in Build and Deployment).
      dependsOn:
        - a511a9a9-1b75-4dfd-8a4f-e516e8096150 # AI usage policy
        - 0de465a6-55a7-4343-af79-948bb5ff10ba # Evaluation of the trust of used components
      assessment: |
        - Show the approval process and the inventory of allowed AI integrations (tools, MCP servers, skills, models) with pinned versions.
        - Show the vetting record of a recently added integration (publisher, permissions, behavioral integrity check).
      difficultyOfImplementation:
        knowledge: 3
        time: 2
        resources: 1
      usefulness: 4
      level: 3
      tags:
        - ai
        - guidance
        - inventory
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/mcp-security-best-practices
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/agntcy-agent-directory
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-c06
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-c10
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/biv-agent-skills
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/ave-registry
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aima
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/owasp-agentic-top-10
      references:
