      Ready-to-use security rule sets for AI coding assistants (e.g. Cursor,
      GitHub Copilot, Claude, Windsurf, Aider), covering general and
      language/framework-specific secure coding guidance.
  nemo-guardrails:
    uuid: 9b4ca932-004e-4e1f-8589-770393765bd3
    name: NVIDIA NeMo Guardrails
    tags: [ai, guardrails, input-validation]
    url: https://github.com/NVIDIA/NeMo-Guardrails
    description: |-
      Open-source toolkit for programmable guardrails on LLM applications:
      input/output rails for prompt injection and jailbreak detection, topic
      restrictions and policy enforcement around model calls.
  guardrails-ai:
    uuid: 504b5f6c-74e6-4ea7-9480-537284c00b57
    name: Guardrails AI
    tags: [ai, guardrails, output-validation]
    url: https://github.com/guardrails-ai/guardrails
    description: |-
      Open-source framework that validates LLM output against schemas and
      validators (e.g. no secrets/PII, valid JSON, policy compliance) and
      triggers re-asks or corrective actions on violations.
  langfuse:
    uuid: 928b9c82-bf24-466b-a254-d8b775f7e0c8
    name: Langfuse
    tags: [ai, logging, monitoring]
    url: https://github.com/langfuse/langfuse
    description: |-
      Open-source LLM observability platform: traces prompts, tool calls, model
      versions and costs of AI applications and agents, providing the audit
      trail needed for security monitoring of AI interactions.
  eu-ai-act:
    uuid: e1611a8a-4e7d-439a-b9fc-992674c02d53
    name: EU AI Act
    tags: [ai, documentation, compliance]
    url: https://artificialintelligenceact.eu/
    description: |-
      European regulation for AI systems with risk-based obligations. Relevant
      input for an organizational AI usage policy (risk categorization,
      transparency and documentation duties).
  google-saif:
    uuid: d59c5afa-7af6-46c6-b78e-7e0e4e5a47ae
    name: Google Secure AI Framework (SAIF)
    tags: [ai, documentation, threat, framework]
    url: https://saif.google/
    description: |-
      Google's framework for secure AI systems. SAIF 2.0 adds an agent security
      map that decomposes an agent into components (perception, reasoning,
      orchestration, response) with risks and controls per node, naming
      agent-specific risks such as rogue actions and sensitive data disclosure;
      risk data donated to the Coalition for Secure AI.
  mcp-security-best-practices:
    uuid: 322e62f0-fda2-4943-90cc-dd2d6679b1e3
    name: MCP Security Best Practices
    tags: [ai, documentation, mcp]
    url: https://modelcontextprotocol.io/docs/tutorials/security/security_best_practices
    description: |-
      Official security best practices of the Model Context Protocol: attack
      vectors and required controls for MCP clients, servers and proxies
      (e.g. token audience validation, redirect URI exact matching, per-client
      consent). MCP itself does not enforce security at the protocol level;
      implementers must.
  nist-ssdf-genai:
    uuid: 66f319f1-bcff-4d1e-8d65-4cb2939dfc06
    name: NIST SP 800-218A (SSDF Community Profile for Generative AI)
    tags: [ai, documentation, compliance]
    url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-218A.pdf
    description: |-
      NIST's Secure Software Development Framework profile for generative AI
      and dual-use foundation models: SSDF practices augmented with AI-specific
      tasks and recommendations across the development lifecycle. Useful
      compliance anchor for an organizational AI usage policy.
  new-sdlc-vibe-coding:
    uuid: 8077812b-e320-4435-9afb-e1e334314abf
    name: "The New SDLC With Vibe Coding (Google whitepaper)"
    tags: [ai, guidance, documentation]
    url: https://addyosmani.com/blog/new-sdlc-vibe-coding/
    description: |-
      Google whitepaper (Osmani, Saboo, Kartakis) distinguishing vibe coding
      from agentic engineering: specs, guardrails, evals and review as the
      "harness" around the model, phase-specific context engineering, evals in
      CI, traces of every agent run and scoped per-agent permissions as the
      production substrate.
  agntcy-agent-directory:
    uuid: 1cd31e8c-63ff-48a5-b973-3048c9664394
    name: AGNTCY Agent Directory
    tags: [ai, supply-chain, inventory, signing]
    url: https://dir.agntcy.org/latest/
    description: |-
      Open-source federated directory (Linux Foundation/AGNTCY) for publishing
      and discovering agents, MCP servers and agent skills with cryptographic
      signing, verification and provenance of records, usable as a verified
      catalog when assessing and inventorying agent integrations.
  gdm-ai-control-roadmap:
    uuid: f2966f4c-38b2-4dbf-95a4-6f0a8fc15ae3
    name: Google DeepMind AI Control Roadmap
    tags: [ai, monitoring, threat, documentation]
    url: https://storage.googleapis.com/deepmind-media/DeepMind.com/Blog/securing-the-future-of-ai-agents/gdm-ai-control-roadmap.pdf
    description: |-
      Roadmap for controlling potentially misaligned AI agents. It treats
      agents as untrusted principals and layers system-level defences: the
      TRAIT&R threat taxonomy (based on MITRE ATT&CK),
      action/chain-of-thought monitoring, pull-request monitoring, UEBA
      anomaly detection, honeypots and tiered prevention/response up to
      shutdown infrastructure.
  aigf:
    uuid: bbaf5f6a-0366-488b-a712-7f915e866135
    name: Agent Identity Governance Framework (AIGF)
    tags: [ai, isolation, permissions, logging, documentation]
    url: https://labs.cloudsecurityalliance.org/agentic/agentic-identity-governance-framework-v1/
    description: |-
      Vendor-neutral framework (Richard Peddi, v2.1, CC BY 4.0) for identity,
      access and content governance of autonomous AI agents along six axes:
      identification (shadow agents), authentication, authorization,
      audit/non-repudiation (structured audit log with mandatory fields for
      the causal chain, correlation identifiers across multi-agent chains,
      tamper evidence via hash chaining and write-once storage),
      prompt injection prevention and data flow tracking. The framework is
      mapped to EU AI Act, GDPR, ISO 42001/27001 and NIST AI RMF.
  ncc-ai-coding-agent-security:
    uuid: 0c01a64e-23d1-4c2e-a5c2-d728bcce0689
    name: "NCC Group: An Introduction to AI Coding Agent Security"
    tags: [ai, isolation, permissions, threat, documentation]
    url: https://www.nccgroup.com/media/jtepwx1t/nccgroup_codingagentswhitepaper.pdf
    description: |-
      Whitepaper analyzing the security of AI coding agents (Claude Code,
      Cursor, Codex): permission models and dangerous permission modes, sandbox
      implementations and escalations, agent tools, configuration files/hooks
      as attack surface, and untrusted/trusted workspace attack vectors.
  agent-identity-access-model:
    uuid: 181e9b98-7d4f-4fff-9181-9f4c4408022e
    name: Anthropic Agent Identity and Access Model
    tags: [ai, isolation, permissions, documentation]
    url: https://claude.com/blog/agent-identity-access-model
    description: |-
      Reference architecture for agent identity: agents act under dedicated
      workspace-level service accounts instead of user credentials, with scoped
      per-channel permissions, credentials injected at the network boundary,
      egress blocked to unapproved hosts and every agent action logged under
      the agent identity in both platforms' audit logs.
  biv-agent-skills:
    uuid: 0425f6f0-817d-4447-9f81-a59b753b37cc
    name: Behavioral Integrity Verification for AI Agent Skills
    tags: [ai, supply-chain, documentation]
    url: https://arxiv.org/abs/2605.11770
    description: |-
      Research paper formalizing the verification of agent skills: compare the
      capabilities a skill declares with what its code and instructions actually
      do. Found 80% of 49,943 registry skills deviating from declared behavior,
      with 18.9% of the deviations tracing to adversarial intent and credential
      theft as the largest adversarial category. This is the rationale for
      reviewing skills before installation.
  ai-coding-cli-permissions:
    uuid: c4f17d85-4e64-45d9-93aa-59fbef85f8d6
    name: "AI Coding Agent CLI design: Permissions & Sandboxed Execution"
    tags: [ai, isolation, permissions, documentation]
    url: https://system-design-interviews.com/book/interview.html#ai-coding-cli/safety
    description: |-
      System-design walkthrough of an AI coding agent CLI (Claude Code / Codex):
      permission engine with blast-radius split, allow/deny rules, OS-level
      sandbox with default-deny egress, and treating repo content (including
      agent memory files) as untrusted data.
  ai-coding-cli-verify:
    uuid: 0acdc0ea-dbe2-4bcf-9a6c-34fb1c2989a5
    name: "AI Coding Agent CLI design: Verify & Iterate"
    tags: [ai, verification, testing, documentation]
    url: https://system-design-interviews.com/book/interview.html#ai-coding-cli/verify
    description: |-
      System-design walkthrough of the agent verification loop: a dedicated
      check runner executes the project's tests, typechecker, linter and build
      in the sandbox, diffs against a baseline and iterates until green, with
      git checkpoints and the reviewed diff as the human gate.
  ai-coding-cli-cloud:
    uuid: 415def4e-8562-45e3-a085-b7edd5eb4317
    name: "AI Coding Agent CLI design: Background & Cloud Agents"
    tags: [ai, isolation, logging, documentation]
    url: https://system-design-interviews.com/book/interview.html#ai-coding-cli/cloud
    description: |-
      System-design walkthrough of headless cloud agents: ephemeral sandboxes
      with short-lived single-repo tokens, deny-by-default egress, PR review as
      the human gate, anomaly detection and per-tenant retention with secret
      redaction.
  grantguard:
    uuid: 7d17275d-396b-4002-98af-def5770a2035
    name: GrantGuard
    tags: [ai, isolation, permissions, audit]
    url: https://github.com/OpenVanta/GrantGuard
    description: |-
      Audits the accumulated permission allow-list of the Claude Code agent
      (user- and project-level settings): classifies grants into risk categories
      (e.g. destructive wildcards, credential-store access, unrestricted pushes)
      and supports reviewing and removing unsafe permissions. Runs fully local.
  claude-code-devcontainer:
    uuid: 09d76871-83e2-424e-8210-a9aff332b4aa
    name: Claude Code development container reference implementation
    tags: [ai, isolation, container]
    url: https://docs.claude.com/en/docs/claude-code/devcontainer
    description: |-
      Anthropic's reference devcontainer for running the Claude Code agent in an
      isolated container, including an init-firewall.sh script that enforces
      default-deny egress with a domain allow-list via iptables/ipset.
  llm-guard:
    uuid: 498456d3-815a-4f57-84c2-81dcb97a4cb8
    name: LLM Guard
    tags: [ai, data-protection, guardrails]
    url: https://github.com/protectai/llm-guard
    description: |-
      Open-source toolkit that scans LLM prompts and outputs with pluggable
      scanners, e.g. secrets detection, PII anonymization, prompt injection
      detection and toxicity filtering.
  presidio:
    uuid: 240d6d9e-fcf7-422e-bbbb-ef9d820261da
    name: Presidio
    tags: [ai, data-protection, pii]
    url: https://github.com/microsoft/presidio
    description: |-
      Open-source PII detection and de-identification: recognizes and redacts
      personal data (names, credit cards, national IDs, custom entities) in text
      before it is sent to external AI services.
  litellm:
    uuid: 47b4ba95-a6da-4493-94c2-829e9d47b612
    name: LiteLLM Proxy (AI Gateway)
    tags: [ai, data-protection, gateway]
    url: https://github.com/BerriAI/litellm
    description: |-
      Open-source LLM gateway that routes all model traffic through one proxy
      with per-team API keys, audit logging and guardrail hooks (e.g. Presidio
      PII masking, secret detection) applied to every request.
  tealtiger:
    uuid: f38c23e3-adff-43a6-9b72-462f3ffcbad4
    name: TealTiger
    tags: [ai, guardrails, gateway]
    url: https://github.com/agentguard-ai/tealtiger
    description: |-
      Open-source governance layer that wraps LLM clients in-process and
      evaluates deterministic policies before and after every model call:
      guardrails (prompt injection, personally identifiable information (PII)
      and secret detection), cost budgets per request, session and day with
      circuit breakers, behavioral baselines with kill switch, and a
      tamper-evident audit trail with correlation identifiers.
  nightfall-ai:
    uuid: 0a7101ff-dc29-43b0-b9f0-ccbc75dd0f74
    name: Nightfall AI
    tags: [ai, data-protection, commercial]
    url: https://www.nightfall.ai/
    description: |-
      Commercial AI-native DLP platform that detects and redacts secrets and
      personal data in prompts and AI tool usage (e.g. browser plugins, APIs,
      SaaS integrations).
  prompt-security:
    uuid: 6286d7cb-5c99-4cfb-8239-ff9860eaa148
    name: Prompt Security
    tags: [ai, data-protection, commercial]
    url: https://www.prompt.security/
    description: |-
      Commercial platform that inspects employee and application AI traffic for
      data leakage, prompt injection and shadow-AI usage.
  lakera-guard:
    uuid: cbcc6ee0-f7db-4fea-8eb5-d6526e97924e
    name: Lakera Guard
    tags: [ai, data-protection, guardrails, commercial]
    url: https://www.lakera.ai/
    description: |-
      Commercial guardrail API that screens LLM inputs and outputs for prompt
      injection, PII and data leakage in real time.
  spec-kit:
    uuid: 71db66a9-8b71-48e4-9b96-1695ed1062a2
    name: GitHub Spec Kit
    tags: [ai, guidance, framework]
    url: https://github.com/github/spec-kit
    description: |-
      Toolkit for spec-driven development with AI coding assistants: work is
      split into explicit specify, plan, tasks and implement steps, each with
      its own instructions loaded into the model context.
  aisvs-c01:
