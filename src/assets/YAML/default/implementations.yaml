      Appendix C: Appendix C AI for Code Generation.
  owasp-agentic-top-10:
    uuid: 9d226705-6a42-4653-aa98-53d7e69e8a4c
    name: OWASP Top 10 for Agentic Applications
    tags: [ai, documentation, threat]
    url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
    description: |-
      The ten most critical security risks of agentic AI systems (ASI01-ASI10),
      e.g. agent goal hijack, tool misuse, memory poisoning and rogue agents.
      Usable as a threat catalog for threat modeling and red teaming of AI agents.
  mitre-atlas:
    uuid: 5481558b-8dd3-4b56-a904-bcc10d33d24f
    name: MITRE ATLAS
    tags: [ai, documentation, threat]
    url: https://atlas.mitre.org/
    description: |-
      Knowledge base of adversary tactics and techniques against AI-enabled
      systems, usable as a threat catalog during threat modeling of AI
      applications.
  csa-maestro:
    uuid: 49f85de0-6280-454a-bc66-17e007b022bb
    name: CSA MAESTRO
    tags: [ai, documentation, threat]
    url: https://cloudsecurityalliance.org/blog/2025/02/06/agentic-ai-threat-modeling-framework-maestro
    description: |-
      Threat modeling framework of the Cloud Security Alliance (CSA) for
      agentic AI: MAESTRO (Multi-Agent Environment, Security, Threat, Risk and
      Outcome) decomposes an agentic system into seven layers (from foundation
      model to agent ecosystem) and models threats per layer and across
      layer interactions.
  threat-designer:
    uuid: 38b95d1b-558d-4a04-9b68-34f9d57c4aae
    name: Threat Designer
    tags: [ai, threat, tool]
    url: https://github.com/awslabs/threat-designer
    description: |-
      Open-source (Apache 2.0), AI-driven threat modeling application by AWS
      Labs: agents analyze uploaded architecture diagrams, derive STRIDE-based
      threat lists and attack trees, and support iterative refinement and
      export of the resulting threat model.
  apiiro-ai-threat-modeling:
    uuid: bb842e92-ab33-4cd9-8b4e-a24faa23eda2
    name: Apiiro AI Threat Modeling
    tags: [ai, threat, commercial]
    url: https://apiiro.com/blog/introducing-apiiro-ai-threat-modeling/
    description: |-
      Commercial capability that generates architecture-aware threat models
      from feature tickets and design documents before code exists, re-runs
      the analysis autonomously when new tickets arrive (e.g. in Jira or
      GitHub) and compares the threat model against the implemented code to
      surface drift between design intent and implementation.
  fullstory-ai-threat-modeling:
    uuid: 1d8c211c-7987-48c2-8bfc-1f77076516ec
    name: "Rethinking Security: Why ML and AI Demand a New Approach to Threat Modeling"
    tags: [ai, documentation, threat]
    url: https://www.fullstory.com/blog/rethinking-security/
    description: |-
      Experience report on threat modeling machine learning (ML) and AI
      systems in production: standard checklists miss AI-specific risks; a
      data-centric approach following NIST SP 800-154 tracks the data from
      user input through model context, inference and storage. References
      Microsoft's guide "Threat Modeling AI/ML Systems and Dependencies" and
      MITRE ATLAS.
  tm-skills:
    uuid: ec8c0aa5-e308-4d86-88ec-987537b7689a
    name: tm_skills
    tags: [ai, threat, tool]
    url: https://github.com/izar/tm_skills
    description: |-
      Open-source (MIT) collection of agent skills for continuous threat
      modeling by Izar Tarandach, maintainer of pytm: the skills let AI
      coding agents such as Claude Code generate pytm-based threat models
      with data flow diagrams from a codebase, evaluate user stories for
      security-notable events and suggest mitigations, and provide rapid
      security starting points for new systems or features.
  anthropic-zero-trust-agents:
    uuid: 7c0749f8-080d-46cf-a8bb-4c2f8a2c25f2
    name: Zero Trust for AI Agents
    tags: [ai, documentation]
    url: https://claude.com/blog/zero-trust-for-ai-agents
    description: |-
      Free eBook by Anthropic applying Zero Trust principles (never trust,
      always verify; assume breach; least privilege and least agency) to
      agentic AI deployments: current threats to agentic systems, three
      capability tiers for agent identity, access control, observability,
      behavioral monitoring, input and output controls and recovery, an
      eight-phase implementation workflow and defensive operations at the
      speed of autonomous threats. Introduces the design test "does this
      control make the attack impossible, or just tedious?".
  visa-vvah:
    uuid: 3466f3e2-7185-4e97-8799-314a9267f010
    name: Visa Vulnerability Agentic Harness (VVAH)
    tags: [ai, testing, sast]
    url: https://github.com/visa/visa-vulnerability-agentic-harness
    description: |-
      Agentic static application security testing (SAST) pipeline that uses
      frontier AI models for autonomous vulnerability discovery, remediation
      and validation: threat modeling before analysis, multi-lens deep dives
      with adversarial verification and multi-agent voting against false
      positives, followed by proposed and validated fixes.
  xbow:
    uuid: e4c5a35b-532f-42b3-971a-7132f196fb78
    name: XBOW
    tags: [ai, testing, dast, commercial]
    url: https://xbow.com/
    description: |-
      Commercial agentic penetration testing platform: AI agents explore a
      running application autonomously, chain findings into attack paths and
      validate exploitability before reporting.
  pentestgpt:
    uuid: cf897b24-b4d9-418f-a9b0-e110c52cf75e
    name: PentestGPT
    tags: [ai, testing, dast]
    url: https://github.com/GreyDGL/PentestGPT
    description: |-
      Open-source large language model (LLM) assistant for penetration
      testing that guides a human tester interactively through an
      engagement: it keeps track of the test state, suggests next steps and
      helps interpret tool output.
  secure-rules-files:
    uuid: 1e2ce094-e358-47a4-a469-11e0dd8bef26
