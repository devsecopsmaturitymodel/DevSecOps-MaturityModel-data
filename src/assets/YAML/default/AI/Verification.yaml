    Self-verification of AI generated changes:
      uuid: 63e82b31-4167-480d-a22b-baf8ef79af61
      description: |-
        An AI-generated change is only a claim until something independent
        confirms it. Instead of presenting an untested edit, the agent
        executes the checks the project already defines for humans (test
        suite, type checker, linter, build) in its sandboxed environment
        and keeps refining the change until the checks succeed or a defined
        budget ends the attempt. What reaches the human reviewer is then a
        verified state backed by check output, not an assertion. This
        introduces its own failure mode, reward hacking: an agent optimizing
        for passing checks may get there by weakening assertions, deleting
        failing tests or hardcoding expected values instead of fixing the
        code.
      risk: |-
        Unverified AI changes are delivered as plausible-looking code that does
        not build or breaks behavior. Conversely, an agent iterating to green
        without guardrails games the tests (weakened or deleted tests, hardcoded
        results), so a passing suite no longer means correct code.
      measure: |-
        Require AI agents to verify their changes against the project's own
        checks before presenting them, and guard the loop against test
        manipulation: record which checks failed before the agent started so
        it can only claim genuinely new fixes, route every edit that touches
        test code into human review, and re-run the full suite in the
        pipeline independent of the agent's environment.
      dependsOn:
        - f6f7737f-25a9-4317-8de2-09bf59f29b5b # Defined build process
        - eb2c7f9d-d0bd-4253-a2ba-cff2ace4a075 # Security unit tests for important components
      assessment: |
        - Show the agent workflow or configuration that runs the project's own checks (tests, type checker, linter, build) before changes are presented.
        - Show the guardrails against test manipulation: baseline comparison of test results, review flags on modified test code and an independent re-run of the suite in the pipeline.
      difficultyOfImplementation:
        knowledge: 3
        time: 2
        resources: 2
      usefulness: 5
      level: 2
      tags:
        - ai
        - verification
        - testing
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/new-sdlc-vibe-coding
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/ai-coding-cli-verify
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-appc
      references:
        samm2:
          - V-ST-A-1
        iso27001-2017:
          - 14.2.8
        iso27001-2022:
          - 8.29
      comments: ""
    Static and dynamic analysis of AI generated code:
      uuid: 10362082-f48f-4218-be08-4ab78e589df0
      description: |-
        Static and dynamic security testing (SAST, DAST, software composition
        analysis) is defined in the _Test and Verification_ dimension and is
        author-agnostic. This activity references those activities for
        AI-generated code instead of duplicating them. The AI-specific delta
        is coverage and pace: AI agents produce code in places classic scan
        scopes miss (generated infrastructure code, scripts, one-off tools)
        and at a rate that makes scanning inside the development loop (e.g.
        the agent running the static analysis itself during
        self-verification) more important than for human-written code.
        Complementary: _No verification bypass for AI generated code_ ensures
        no delivery path skips these scans.
      risk: |-
        AI-generated code reproduces insecure patterns from training data at
        scale. If static and dynamic analysis does not cover all AI-produced
        artifacts, typical vulnerabilities (injection, insecure defaults,
        hardcoded secrets) ship unnoticed, faster and in higher volume than
        with human-written code.
      measure: |-
        Apply the established static and dynamic security analysis to all
        AI-generated code and artifacts. Include AI-produced infrastructure
        code and scripts in the scan scope and surface findings inside the
        AI-assisted development loop, so agents can fix them before human
        review.
      dependsOn:
        - 6c05c837-8c99-46e2-828b-7c903e27dba4 # Static analysis for important server side components
        - 07796811-37f9-467c-9ff2-48f346e77ff3 # Simple Scan
      assessment: |
        - Show that the scan scope includes AI-produced artifacts such as generated infrastructure code and scripts.
        - Show a recent AI-generated change where static analysis findings were surfaced and fixed inside the AI-assisted development loop.
      difficultyOfImplementation:
        knowledge: 2
        time: 2
        resources: 2
      usefulness: 4
      level: 2
      tags:
        - ai
        - verification
        - testing
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-appc
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/ai-coding-cli-verify
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/vulnhunter
      references:
        samm2:
          - V-ST-A-1
        iso27001-2017:
          - 14.2.8
        iso27001-2022:
