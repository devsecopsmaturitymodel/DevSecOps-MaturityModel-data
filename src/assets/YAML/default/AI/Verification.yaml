---
AI:
  Verification:
    Human review of AI generated specifications:
      uuid: 09307f26-bf34-49c2-828e-649130876978
      description: |-
        In AI-assisted development, human attention scales best at the
        specification level: one page of specification determines what all
        downstream artifacts (plans, code, tests) will contain, and an
        error here is multiplied into every one of them. Reviewing the
        specification the AI works from (a user story with acceptance
        criteria, or the specify-phase artifact in spec-driven development)
        catches wrong intent, missing security requirements and wrong
        assumptions before anything is generated. It is the first rung of
        the human-oversight ladder that continues with _Human review of AI
        generated plans_, _Human review of AI generated code_ and _Human
        approval for irreversible AI agent actions_ (Isolation).
      risk: |-
        An AI assistant implements exactly what an unreviewed specification
        says: missing authorization requirements, absent abuse cases and
        wrong assumptions are faithfully turned into plans, code and tests.
        Later code review rarely catches this, because reviewers check whether
        the code matches the specification, not whether the specification is
        right.
      measure: |-
        Require human review of the specification before AI-assisted
        implementation starts: are the security acceptance criteria complete,
        are scope and assumptions correct, is anything security-relevant
        missing? In spec-driven workflows, make this review the gate of the
        specify phase and keep the reviewed specification under version
        control.
      dependsOn:
        - 923a2a23-d63b-421c-926a-191d1dd5f570 # Spec-driven development
      assessment: |
        - Show a recent specification an AI assistant worked from and its documented human review before implementation started.
        - Show that the review checked the security acceptance criteria (e.g. review comments or a checklist).
        - In spec-driven workflows: show that the specify phase cannot be left without the review gate.
      difficultyOfImplementation:
        knowledge: 2
        time: 2
        resources: 1
      usefulness: 5
      level: 2
      tags:
        - ai
        - verification
        - human-review
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/new-sdlc-vibe-coding
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/spec-kit
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-appc
      references:
        samm2:
          - D-SR-A-1
        iso27001-2017:
          - 14.1.1
        iso27001-2022:
          - 8.26
      comments: ""
    Human review of AI generated plans:
      uuid: 1bd1308d-ae3b-499a-ae81-818993571f52
      description: |-
        Between specification and code sits the plan: which components are
        touched, which dependencies are added, how the security requirements
        will be implemented. Reviewing the AI-generated plan catches
        design-level flaws (a dropped security requirement, an insecure
        design choice, an unnecessary new dependency, changes to
        security-critical components) while they are still one line in a
        plan instead of hundreds of generated lines of code. In spec-driven
        development this is the gate of the plan phase; agents also propose
        plans outside formal workflows (e.g. a plan mode) that can be
        reviewed the same way.
      risk: |-
        The AI-generated plan silently drops security requirements from the
        specification, chooses an insecure design or pulls in avoidable
        dependencies. The agent then generates large amounts of code against
        the flawed plan. Code reviewers, biased by plausible-looking
        code, then verify the implementation against the plan instead of
        questioning the plan itself.
      measure: |-
        Require human review of the plan before AI-assisted implementation:
        verify that every security requirement from the specification is
        carried through, that security-relevant design decisions are
        justified and that changes to security-critical components are
        flagged for deeper review. In spec-driven workflows, make this
        review the gate of the plan phase and keep the reviewed plan under
        version control.
      dependsOn:
        - 09307f26-bf34-49c2-828e-649130876978 # Human review of AI generated specifications
        - 923a2a23-d63b-421c-926a-191d1dd5f570 # Spec-driven development
      assessment: |
        - Show a recent AI-generated plan and its documented human review before implementation.
        - Show that the review traced the security requirements from the specification into the plan.
        - Show how plans touching security-critical components are flagged for deeper review.
      difficultyOfImplementation:
        knowledge: 3
        time: 2
        resources: 1
      usefulness: 4
      level: 2
      tags:
        - ai
        - verification
        - human-review
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/new-sdlc-vibe-coding
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/spec-kit
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-appc
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/threat-modeling-play
      references:
        samm2:
          - D-SR-A-1
        iso27001-2017:
          - 14.2.1
        iso27001-2022:
          - 8.25
      comments: ""
    Human review of AI generated code:
      uuid: d6bc0b7f-fd98-49fe-b66c-7c5fa70452c6
      description: |-
        AI-generated code is plausible-looking by construction and often accepted
        without scrutiny ("automation bias"). It must be treated like code from an
        untrusted contributor: a human with knowledge of the codebase reviews it
        before it is merged. The upstream reviews of specification and plan
        (_Human review of AI generated specifications_, _Human review of AI
        generated plans_) reduce what code review must catch, and the
        automated gates (_Self-verification of AI generated changes_, _Static
        and dynamic analysis of AI generated code_) filter mechanical
        findings. Neither replaces this activity: agents deviate from
        approved plans, so the code remains the last artifact gate before
        merge.
      risk: |-
        AI-generated code containing subtle logic flaws, insecure defaults or
        hallucinated/typo-squatted dependencies is merged unreviewed because it
        "looks right" and compiles.
      measure: |-
        Require human review for all AI-generated changes before merge. Reviewers are
        accountable for the change as if they had written it. AI agents must not be
        able to approve or merge their own pull requests.
      dependsOn:
        - 45f722b2-25b4-472a-a743-f7207a77b5c9 # Least privilege on external systems for AI agents
      assessment: |
        - Show branch protection requiring human review before merge and that agent identities cannot approve or merge their own pull requests.
        - Show recent reviews of AI-generated changes and who is accountable for them.
      difficultyOfImplementation:
        knowledge: 2
        time: 3
        resources: 1
      usefulness: 5
      level: 3
      tags:
        - ai
        - verification
        - human-review
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/new-sdlc-vibe-coding
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/gdm-ai-control-roadmap
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/ai-coding-cli-verify
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-appc
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/github-policies
      references:
        samm2:
          - V-ST-A-1
        iso27001-2017:
          - 14.2.3
        iso27001-2022:
          - 8.29
      comments: ""
    Validation of AI-suggested dependencies:
      uuid: df2db3f4-bae6-448e-844e-9562a4eabc39
      description: |-
        AI assistants hallucinate package names: research found around 20% of
        dependencies suggested by LLMs do not exist. Attackers register these
        names ("slopsquatting") or typo-variants on public registries, so blindly
        installing AI-suggested packages imports attacker-controlled code.

        Automate the checks so they do not depend on developer discipline:

        - **Enforce a minimum OpenSSF Scorecard score** for new
          dependencies, e.g. as a policy check in a pull-through proxy like an artifact registry or in the pull request
          pipeline. Scorecard rates projects on maintenance, code review,
          branch protection, dangerous workflows and vulnerability
          handling; a threshold (e.g. score >= 5) filters low-hygiene and
          abandoned packages before a human even reviews them.
        - **Verify identity and existence**: does the package match the
          intended project (publisher, source repository, age, download
          counts)? Hallucinated and slopsquatted names fail exactly these
          checks; tools like packj flag them automatically.
        - **Gate before merge**: run the established software composition
          analysis and the artifact repository policy on the change that
          adds the dependency, so a malicious or compromised version never
          enters the build.
      risk: |-
        A developer installs an AI-suggested package that is hallucinated,
        typo-squatted or malicious. The package executes attacker code during
        install or at runtime and compromises the application and build
        environment.
      measure: |-
        Verify every AI-suggested dependency before adoption: check that the
        package exists, is the intended one (name, publisher, repository), is
        actively maintained and passes the established software composition
        analysis. Prefer dependencies already used in the organization.
      dependsOn:
        - d918cd44-a972-43e9-a974-eff3f4a5dcfe # Software Composition Analysis (server side)
      assessment: |
        - Show the documented verification steps for adopting a new dependency and a recent example of an AI-suggested package that was checked (or rejected).
        - Show that software composition analysis covers AI-suggested packages before merge.
      difficultyOfImplementation:
        knowledge: 2
        time: 2
        resources: 1
      usefulness: 4
      level: 2
      tags:
        - ai
        - verification
        - sca
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-c06
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-appc
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/packj
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/openssf-scorecard
      references:
        samm2:
          - V-ST-A-2
        iso27001-2017:
          - 14.2.5
        iso27001-2022:
          - 8.27
      comments: ""
    Security test generation with AI:
      uuid: fea96e68-de10-4a62-9df0-4727f700a4a0
      description: |-
        AI assistants can generate security-focused test cases (abuse cases,
        authorization tests, input fuzzing, tests derived from threat models and
        acceptance criteria) alongside the implementation, increasing security
        test coverage at low cost.
      risk: |-
        Security requirements are implemented but never tested, because writing
        security tests manually is perceived as too expensive. Regressions in
        security controls go unnoticed.
      measure: |-
        Use AI assistants to generate security test cases from security acceptance
        criteria and threat models (e.g. negative tests, authorization matrices,
        injection payloads). Review generated tests like any other AI-generated
        code and run them in the delivery pipeline.
      dependsOn:
        - 1caad69c-316c-422a-a56b-04ad6f6cc306 # Security requirements for AI-assisted development
        - d6bc0b7f-fd98-49fe-b66c-7c5fa70452c6 # Human review of AI generated code
      assessment: |
        - Show security test cases generated from acceptance criteria or threat models and their human review.
        - Show the generated tests running in the delivery pipeline.
      difficultyOfImplementation:
