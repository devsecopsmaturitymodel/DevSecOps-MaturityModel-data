    Continuous detection of compromised AI components:
      uuid: db390bba-3a49-4b1f-9982-c7d79fe88ea1
      description: |-
        Trust evaluation at adoption time (see _Evaluation of the trust of
        used AI components_) does not catch compromise that happens
        afterwards: AI components can be hijacked later like any other
        dependency, e.g. through a compromised publisher account or a
        malicious update. The basis is _Test for compromised components_
        (Test and Verification, Static depth for applications); behavioral
        classification registries extend it to AI components: they catalog
        agent extensions (skills, MCP servers, plugins) under persistent
        identifiers together with a record of how each component actually
        behaves, so a component whose behavior starts to deviate, or that
        appears in compromise advisories, can be identified and blocked like
        a compromised package.
      risk: |-
        An approved AI component (skill, MCP server, plugin, model) is
        compromised after its adoption, e.g. via a hijacked maintainer
        account. The malicious update runs with the agent's privileges and
        remains trusted, because it was vetted once and is never re-checked.
      measure: |-
        Continuously check the inventory of approved AI components against
        compromise intelligence: match components and versions against
        behavioral classification registries and compromise advisories,
        alert on deviations between declared and observed behavior and
        quarantine affected components analogous to _Test for compromised
        components_.
      dependsOn:
        - 399c5b7f-1310-4841-89f7-16daff2fe3ef # Evaluation of the trust of used AI components
        - 9c776b4e-5895-4040-b63b-c74236ec71b3 # Test for compromised components
      assessment: |
        - Show how the inventory of approved AI components is matched against compromise intelligence (e.g. a behavioral classification registry) and how often.
        - Show the alerting and quarantine process and what happened on the last hit or test.
      difficultyOfImplementation:
        knowledge: 3
        time: 2
        resources: 2
      usefulness: 4
      level: 4
      tags:
        - ai
        - verification
        - inventory
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/ave-registry
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/openssf-malicious-packages
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-c06
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/owasp-agentic-top-10
      references:
        samm2:
          - O-EM-A-1
        iso27001-2017:
          - 15.1.1
        iso27001-2022:
          - 5.19
      comments: ""
    Drift detection for agent instructions and guardrails:
      uuid: 30e29dfc-2bb8-4fe1-bc7e-b3a9ade1ee9e
      description: |-
        _Protection of agent memory against poisoning_ puts system prompts,
        rule files and guardrail configurations under version control and
        review. Drift detection continuously verifies that what runs in
        production still matches the approved state. Deployed instructions
        and guardrails can be changed past the review process: through a
        quick hotfix, direct console access, a compromised pipeline or an
        agent writing to its own configuration. Comparing hashes of the
        normalized deployed content against the last approved repository
        version detects such silent changes. The generic detection of
        configuration drift in production is defined in _Drift detection for
        deployed configuration_ (Build and Deployment). This activity
        extends it to the content assets that determine agent behavior.
      risk: |-
        A system prompt or guardrail configuration is modified outside the
        review process (by an attacker, by an agent altering its own
        instructions or by a well-meant manual hotfix). The deployed agent
        behaves differently from the reviewed state, loosened guardrails are
        never tightened again ("configuration drift") and nobody notices,
        because the repository still looks correct.
      measure: |-
        Compare the deployed state of agent instructions (system prompts,
        rule files) and guardrail configurations against the last approved
        repository version on a schedule (at every deployment and at least
        daily) using hashes of normalized content. Alert on every deviation,
        treat drift of instructions or guardrails as a security incident with
        high priority, and either restore the approved version or formally
        re-approve the change. Document known runtime transformations as
        normalization exceptions to keep the false-positive rate low.
      dependsOn:
        - 106622af-8969-4d9b-81ad-86d8e2bfd631 # Protection of agent memory against poisoning
        - 9cba815f-02d2-4b06-a11f-7f28580e135a # Drift detection for deployed configuration
      assessment: |
        - Show the drift detection mechanism (hash comparison of normalized content), its schedule and the covered assets (system prompts, rule files, guardrail configurations).
        - Demonstrate that an out-of-band change to a deployed system prompt or guardrail raises an alert within the scan cycle.
        - Show how the last drift alert was handled (restore or formal re-approval) and the documented normalization exceptions.
      difficultyOfImplementation:
        knowledge: 3
        time: 2
        resources: 2
      usefulness: 4
      level: 5
      tags:
        - ai
        - verification
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aigf
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/owasp-agentic-top-10
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aima
      references:
        samm2:
          - O-EM-A-2
        iso27001-2017:
          - 12.1.2
        iso27001-2022:
          - 8.9
      comments: ""
