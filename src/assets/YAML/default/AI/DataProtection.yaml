    Hallucination detection for AI responses:
      uuid: 51a63793-c2c5-4438-bfd6-b7dee604a76d
      description: |-
        Distinct from output encoding (a security control against malicious
        output, see _Secure output handling in AI applications_), this activity
        addresses correctness: model output can be confidently wrong, with
        fabricated facts, citations, URLs, API endpoints and identifiers.
        Hallucinations become a security problem when downstream components
        or users trust them: hallucinated links and package names can be
        registered by attackers, fabricated identifiers corrupt data, invented
        facts drive wrong decisions. Applies to AI features the organization
        ships.

        Practical layers, ordered by effort:

        1. **Constrain generation**: prefer retrieval-augmented generation
           over free generation for factual answers and instruct the model
           to answer only from the provided sources and to say "I don't
           know" otherwise.
        2. **Groundedness rails**: fact-checking rails compare each claim in
           the response against the retrieved source passages and block or
           flag unsupported claims (NeMo Guardrails fact-check rail,
           Guardrails AI provenance/grounding validators).
        3. **Existence checks**: mechanically verify artifacts the model
           emits before they are shown or used. Do referenced URLs resolve,
           do cited documents exist in the knowledge base, do emitted API
           endpoints and identifiers exist in the target system?
        4. **Citations and confidence**: require source citations in
           user-facing answers and display them, so users can verify claims;
           route ungrounded or low-confidence answers to a human fallback.
        5. **Regression testing**: track hallucination rates with an
           evaluation suite (e.g. promptfoo) over prompt, model and
           guardrail changes.
      risk: |-
        Users and downstream systems act on fabricated AI content: they follow
        hallucinated URLs that attackers have registered, store invented
        identifiers, or make decisions based on confidently presented false
        facts, all without any attacker involvement in the prompt.
      measure: |-
        Validate the factual grounding of AI responses before they are trusted:
        check claims against the retrieved sources in retrieval-augmented
        generation (RAG) systems, require and
        verify citations, verify that emitted URLs, API endpoints and
        identifiers exist, and route low-confidence or ungrounded answers to a
        human or suppress them.
      dependsOn:
        - 24990a5e-b0e6-4e2c-b06b-4e9f0d6f7b21 # Secure output handling in AI applications
      assessment: |
        - Show the groundedness or fact-checking configuration and citations in user-facing answers.
        - Show the existence checks for emitted URLs, API endpoints and identifiers.
        - Show evaluation results tracking the hallucination rate over prompt, model and guardrail changes.
      difficultyOfImplementation:
        knowledge: 4
        time: 3
        resources: 2
      usefulness: 3
      level: 4
      tags:
        - ai
        - data-protection
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/nemo-guardrails
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/guardrails-ai
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/promptfoo
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-c07
      references:
        samm2:
          - D-SR-A-2
        iso27001-2017:
          - 14.2.5
        iso27001-2022:
          - 8.27
      comments: ""
    Protection of agent memory against poisoning:
      uuid: 106622af-8969-4d9b-81ad-86d8e2bfd631
      description: |-
        Unlike one-time prompt injection, memory poisoning persists: AI agents
        retain context across sessions in rule files (e.g. CLAUDE.md, AGENTS.md),
        memory directories, conversation summaries and retrieval-augmented
        generation (RAG) knowledge/vector stores. Content
        an attacker smuggles into this persistent state (via issues, code
        comments, documents or web content the agent processes) corrupts every
        future session and can spread to all developers through version control.
      risk: |-
        An attacker manipulates the agent into persisting malicious instructions
        into its memory or shared rule files. The backdoor survives session
        restarts, biases future reasoning and tool use (e.g. suppressing security
        checks, exfiltrating data) and propagates across the team via the
        repository or shared knowledge bases.
      measure: |-
        Treat writes to agent memory and rule files like code changes: keep them
        under version control and human review, restrict write access to shared
        rule files and knowledge/vector stores, validate the provenance of
        ingested knowledge and periodically review or reset persistent memory.
        Apply retention limits (time-to-live) so that unverified memory,
        especially content derived from external inputs or tool outputs,
        expires instead of persisting indefinitely. Version memory stores so
        that detected poisoning can be answered by rolling back to a
        known-good state instead of purging everything. Segment memory by
        user and session and keep credentials and other secrets out of it:
        cached secrets in shared memory let a later session act with the
        permissions of an earlier one (OWASP Top 10 for Agentic
        Applications, ASI03). Do not re-ingest the agent's own outputs into
        trusted memory automatically, as this self-reinforces errors and
        planted instructions ("bootstrap poisoning", ASI06).
      dependsOn:
        - 0012e51c-a068-4549-a4d5-d1957b52676f # Input validation for AI systems
      assessment: |
        - Show that agent rule files and memory are under version control and require review on change.
        - Show the write-access restrictions on shared rule files and knowledge/vector stores.
        - Show the last review or reset of persistent agent memory.
        - Show the retention limits for unverified memory and demonstrate a rollback of a memory store to a known-good state.
        - Show the memory segmentation between users and sessions and the rule that keeps credentials out of agent memory.
      difficultyOfImplementation:
        knowledge: 3
        time: 2
        resources: 1
      usefulness: 4
      level: 5
      tags:
        - ai
        - data-protection
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/ai-coding-cli-permissions
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-c08
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/owasp-agentic-top-10
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/anthropic-zero-trust-agents
      references:
        samm2:
          - O-EM-A-2
        iso27001-2017:
          - 12.1.2
        iso27001-2022:
          - 8.9
      comments: ""
    Automated data leak detection for AI interactions:
      uuid: 8d5ce64e-ebf0-45ab-93cb-d592287e3023
      description: |-
        Technical controls (e.g. AI gateways/proxies, secret scanners on prompts,
        DLP filters) automatically detect and block sensitive data such as secrets,
        access tokens and personal data before it is sent to external AI services.

        Typical setup: route all model traffic through an LLM gateway (e.g.
        LiteLLM Proxy) and attach scanners as guardrail hooks, such as
        Presidio for PII redaction and LLM Guard or trufflehog-style secret
        detectors for credentials. Commercial alternatives with managed AI-DLP include
        Nightfall AI, Prompt Security, Lakera Guard and the GenAI-DLP features
        of CASB/SSE platforms (e.g. Netskope, Zscaler).
      risk: |-
        Policies and awareness alone do not prevent accidental leaks. A single pasted
        production credential or customer data set in a prompt can lead to a
        compromise or a privacy violation.
      measure: |-
        Route traffic to external AI services through a gateway that scans prompts
        and attachments for secrets and personal data, blocks or redacts findings
        and provides an audit trail of AI tool usage.
      dependsOn:
        - dc62d384-0b9c-47d9-b7a5-9d82e53642ba # Basic data leak prevention
      assessment: |
        - Show the gateway or proxy through which traffic to external AI services flows and its scanner configuration.
        - Demonstrate that a test secret or test personal data in a prompt is blocked or redacted.
        - Show the audit trail of AI tool usage.
      difficultyOfImplementation:
        knowledge: 3
        time: 3
        resources: 3
      usefulness: 4
      level: 4
      tags:
        - ai
        - data-protection
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/aisvs-c12
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/litellm
