          - 8.24 # Use of cryptography
      comments: ""
 
    Dynamic and short-lived secrets:
      uuid: 79e29261-b881-451e-b5c3-4b5607f19400
      description: |
        High-value credentials (databases, cloud APIs) are generated on demand with
        short time-to-live values rather than being issued as long-lived static
        secrets, and workload-to-workload authentication uses short-lived certificates.
      risk:
        Long-lived static credentials are valuable and reusable if stolen. Short
        TTLs mean a leaked credential is useless within minutes and rotation is
        automatic by design.
      measure: |
        - Access to key backends uses dynamically generated, short-lived credentials.
        - TTLs are short enough that leaked credentials expire quickly.
        - Static long-lived credentials for these backends are being eliminated.
        - Short-lived certificates (e.g. mTLS / SPIFFE-SVID) are used for
          workload-to-workload authentication.
      assessment: |
        - Demonstrate a workload obtaining a short-lived, on-demand credential.
        - Show the configured TTL and that the credential expires.
      difficultyOfImplementation:
        knowledge: 4
        time: 4
        resources: 3
      usefulness: 4
      level: 3
      dependsOn:
        - Access-controlled and audited secret access
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/hashicorp-vault
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/openbao
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/infisical
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/spiffe-spire
      tags:
