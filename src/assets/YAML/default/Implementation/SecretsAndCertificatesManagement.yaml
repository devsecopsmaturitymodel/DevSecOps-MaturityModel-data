    # ---------- Level 4: automate and assure ----------
 
    Federated workload identity and access:
      uuid: 6c1f0a2d-4e83-4b19-9a7c-1d0e5f8b3c62
      description: |
        Workloads and pipelines obtain access by federating their identity - OIDC/OAuth
        token exchange, cloud workload identity federation, or SPIFFE/SPIRE trust-domain
        federation - and receiving short-lived tokens or certificates, rather than
        holding a stored long-lived credential. This is the mechanism that makes "no
        stored secret" achievable. (Complements the Identity and Access Management
        activity "Workload and machine identity", which covers the identity side.)
      risk:
        Storing a long-lived credential for every workload and pipeline that needs cloud
        or cross-service access creates a large, static, copyable attack surface.
        Federating identity removes the stored secret entirely - there is nothing to
        leak, and access is bound to a scoped, revocable trust relationship.
      measure: |
        - Workloads and pipelines authenticate to cloud / service providers via
          federated identity (e.g. OIDC token exchange), not stored keys.
        - Federated trust relationships are explicitly configured, least-privilege
          scoped and reviewed.
        - Access is issued as short-lived tokens or certificates from the federation.
      assessment: |
        - Show a workload / pipeline obtaining cloud or service access via federation
          with no stored key (e.g. a CI job assuming a cloud role via OIDC).
        - Present the federated trust configuration and its scoping.
      difficultyOfImplementation:
        knowledge: 4
        time: 4
        resources: 3
      usefulness: 4
      level: 4
      dependsOn:
        - Access-controlled and audited secret access
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/spiffe-spire
      tags:
        - secret-management
        - federation
        - workload-identity
        - certificates
      references:
