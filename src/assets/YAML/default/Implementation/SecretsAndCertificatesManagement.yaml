# yaml-language-server: $schema=../../schemas/dsomm-schema-implementation.json
---
Implementation:
  Secret and Certificate Management:
 
    # ---------- Level 1: no-brainers - keep them out, detect them ----------
 
    No plaintext secrets in source code:
      uuid: 7058be97-575a-48f8-8f2f-b2e4d37cae97
      description: |
        Credentials, tokens, keys and certificates never appear in plaintext in source
        control, container images or committed configuration. They are supplied to the
        application at runtime instead. Secrets held *encrypted* at rest in version
        control are a sanctioned exception - the plaintext still never appears.
      risk:
        Plaintext secrets committed to a repository are exposed to everyone with read
        access and remain recoverable from git history even after deletion, a leading
        cause of real-world breaches. Secrets baked into images travel wherever the
        artifact goes and cannot be changed without a rebuild, so a leak forces a full
        redeploy and the old value often lingers.
      measure: |
        - No plaintext secrets exist in code, committed configuration or container images.
        - Secrets are supplied at runtime (environment, mounted secret, or store
          lookup) rather than baked into the artifact.
        - Configuration and secrets are separated - configuration in code, secrets external.
        - Private keys and certificates are mounted or fetched at runtime, never
          committed or baked into images.
        - Anything that is committed is encrypted at rest.
      assessment: |
        - Inspect a repository and a built image and confirm no plaintext secrets.
        - Show how a running application obtains its secrets at runtime.
      difficultyOfImplementation:
        knowledge: 2
        time: 2
        resources: 1
      usefulness: 5
      level: 1
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/managing-secrets
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/owasp-secrets-management-cheatsheet
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/owasp-key-management-cheatsheet
      tags:
        - secret-management
        - certificates
        - configuration
      references:
        samm2:
          - I-SD-B-1 # Secure Deployment: Secret Management, maturity 1
        iso27001-2017:
          - 14.2.1 # Secure development policy
          - 10.1.1 # Policy on the use of cryptographic controls
        iso27001-2022:
          - 8.28 # Secure coding
          - 5.17 # Authentication information
          - 8.24 # Use of cryptography
      comments: ""
 
    Secret scanning of repositories:
      uuid: 4ee301cb-ff8f-436b-be81-64cf1d076dac
      description: |
        Automated scanning looks for credentials, tokens and keys across repositories
        and their history. Scanning is the cheapest secret control to introduce because
        it needs no change to the developer workflow, but it is *detective* - it finds
        what is already there. Its effectiveness depends far less on the tool than on
        having a defined owner for each finding.
      risk:
        Without scanning, a committed credential can sit undiscovered in git history
        for years, readable by anyone who can clone the repository, and stays valid
        because nobody knows it needs rotating.
      measure: |
        - Automated secret scanning runs across repositories, including existing
          history, on a defined schedule and/or in CI.
        - Every finding has a defined route to an accountable owner - normally the team
          owning the repository, not a central queue nobody reads.
        - Findings are triaged within an agreed time, and any confirmed exposure is
          rotated. Deleting or reverting the commit is not sufficient: history, clones,
          forks and CI caches persist.
      assessment: |
        - Show the scanner configured and the repositories in scope, including history.
        - Present recent findings, who they were routed to, and how quickly they were triaged.
        - Show evidence that a confirmed finding resulted in a rotated credential.
      difficultyOfImplementation:
        knowledge: 1
        time: 2
        resources: 1
      usefulness: 5
      level: 1
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/gitleaks
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/trufflehog
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/betterleaks
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/detect-secrets
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/trivy
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/nosey-parker
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/titus
      tags:
        - secret-management
        - secret-scanning
      references:
        samm2:
          - I-SD-B-1 # Secure Deployment: Secret Management, maturity 1
        iso27001-2017:
          - 12.6.1 # Management of technical vulnerabilities
          - 14.2.1 # Secure development policy
        iso27001-2022:
          - 8.8  # Management of technical vulnerabilities
          - 8.28 # Secure coding
      comments: ""
 
    # ---------- Level 2: don't hold the secret in the first place ----------
 
    Prevention of secrets reaching the repository:
      uuid: 2e6b91f4-5c83-4d70-a92e-8f14c73b0d56
      description: |
        A server-side check rejects a push containing a detected secret, so the value
        never lands in the shared repository. Because it runs on the server - a
        pre-receive hook, a platform push-protection feature, or an equivalent blocking
        gate - it cannot be skipped by an individual developer, and it is unambiguous
        who owns the finding: the person pushing.
 
        Where the platform's built-in detection is weak, running a dedicated scanner in
        a server-side hook gives better coverage than the native feature. Client-side
        pre-commit hooks give faster feedback and are worth offering, but they run on
        the developer's machine and can be disabled, so they are defence in depth
        rather than the enforcing control.
      risk:
        With detection alone, every secret still reaches the shared repository and its
        history before anyone knows. Once pushed, a secret must be treated as
        compromised and rotated whether or not the commit is reverted, because history,
        clones, forks and CI caches persist.
      measure: |
        - A server-side check rejects pushes containing detected secrets.
        - The check cannot be bypassed by an individual developer.
        - Where the platform's native detection is weak, a dedicated scanner is run in
          the server-side hook rather than relying on the built-in feature.
        - Pre-commit hooks are offered to developers for faster feedback, but are not
          relied on as the enforcing control.
        - Any bypass or exception is recorded and reviewed.
      assessment: |
        - Attempt to push a test credential and show the push is rejected.
        - Show the check is enforced server-side, not only in a local hook.
        - Present the record of any bypasses granted.
      difficultyOfImplementation:
        knowledge: 2
        time: 3
        resources: 2
      usefulness: 5
      level: 2
      dependsOn:
        - Secret scanning of repositories
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/github-push-protection
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/pre-commit
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/gitleaks
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/trufflehog
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/betterleaks
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/detect-secrets
      tags:
        - secret-management
        - secret-scanning
        - prevention
      references:
        samm2:
          - I-SD-B-2 # Secure Deployment: Secret Management, maturity 2
        iso27001-2017:
          - 14.2.1 # Secure development policy
          - 10.1.1 # Policy on the use of cryptographic controls
        iso27001-2022:
          - 8.28 # Secure coding
          - 8.24 # Use of cryptography
      comments: ""
 
    Encrypted (sealed) secrets in version control:
      uuid: 9d4f7e15-2b6a-4c83-a5e0-3f81c9276b4d
      description: |
        Secrets are encrypted at rest so the ciphertext can safely live in the Git
        repository, and are only decrypted at deploy time by a key held by the
        target cluster or pipeline. Tools such as Sealed Secrets, SOPS or git-crypt
        give versioned, reviewable secret changes without a central secret manager -
        a realistic step for teams not yet running a vault.
      risk:
        Without either encryption or a secret manager, secrets end up as plaintext in
        CI variables, config files, wikis and tickets, readable by anyone with repo or
        pipeline access, with no history of who changed what and no way to revoke a
        single consumer.
      measure: |
        - Secrets held in version control are encrypted (e.g. Sealed Secrets, SOPS,
          git-crypt); plaintext is never committed.
        - The decryption key is held by the target cluster or pipeline, not by
          individual developers.
        - Secret changes flow through the normal review and audit trail of version control.
        - Encryption keys themselves are managed and rotatable.
      assessment: |
        - Show an encrypted secret in the repository and confirm it cannot be
          decrypted without the cluster / pipeline key.
        - Show where the decryption key lives and who can access it.
        - Demonstrate a secret change arriving via a reviewed commit.
      difficultyOfImplementation:
        knowledge: 2
        time: 2
        resources: 1
      usefulness: 4
      level: 2
      dependsOn:
        - No plaintext secrets in source code
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/sealed-secrets
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/sops
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/git-crypt
      tags:
        - secret-management
        - gitops
        - encryption
      references:
        samm2:
          - I-SD-B-2 # Secure Deployment: Secret Management, maturity 2
        iso27001-2017:
          - 10.1.1 # Policy on the use of cryptographic controls
          - 10.1.2 # Key management
        iso27001-2022:
          - 8.24 # Use of cryptography (2022 merges 10.1.1 and 10.1.2)
      comments: ""
 
    Secret delivery without human handling:
      uuid: 4a8c30e7-95d1-4b62-8e74-2c0fb6a9d581
      description: |
        Secrets reach the running workload through an automated path, so no person
        copies, pastes or manually applies a plaintext value in order to deploy. The
        mechanism is not prescribed: a sealed secret decrypted in-cluster, a GitOps
        operator synchronising from a store, a service operator generating the
        credential at provisioning time, or the workload reading it at startup all
        qualify.
      risk:
        If a person must fetch and paste a secret in order to deploy, the plaintext
        spreads to laptops, terminal history, tickets and chat, and everyone who
        touched it becomes a credential holder who must be tracked, off-boarded and
        rotated for. Manual handling during delivery is where most accidental exposure
        happens.
      measure: |
        - Secrets are delivered to workloads by an automated path - sealed secret
          decrypted in-cluster, operator sync, operator-generated credential, or
          runtime lookup - rather than applied by hand.
        - A change that consumes a secret can be deployed without anyone reading or
          re-entering its plaintext value.
        - Plaintext values do not appear in deployment tickets, chat, hand-set CI
          variables or a person's shell history.
        - Where the platform supports it, credentials are generated automatically at
          provisioning time so no human-known value ever exists.
      assessment: |
        - Deploy a change requiring a secret and show that no person handled the plaintext.
        - Show the delivery mechanism in use (sealed secret, operator, sync or runtime lookup).
        - Show that a secret can be rotated and applied without a person reading the new value.
      difficultyOfImplementation:
        knowledge: 3
        time: 3
        resources: 2
      usefulness: 5
      level: 2
      dependsOn:
        - No plaintext secrets in source code
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/sealed-secrets
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/external-secrets-operator
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/secrets-store-csi-driver
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/hashicorp-vault
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/infisical
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/argocd
      tags:
        - secret-management
        - automation
        - gitops
        - delivery
      references:
        samm2:
          - I-SD-B-2 # Secure Deployment: Secret Management, maturity 2
        iso27001-2017:
          - 9.4.1  # Information access restriction
          - 10.1.2 # Key management
        iso27001-2022:
          - 8.3  # Information access restriction
          - 8.24 # Use of cryptography
      comments: ""
 
    # ---------- Level 3: centralize and control what must be stored ----------
 
    Inventory of secrets and certificates:
      uuid: 5a2e8f31-7c04-4d69-b8a1-e63f0947cb25
      description: |
        A current inventory records every secret and certificate in use - what it is,
        where it lives, which system consumes it, who owns it and when it expires.
        You cannot scope, rotate or revoke what you cannot enumerate.
      risk:
        Without an inventory, forgotten credentials and certificates accumulate in
        pipelines, config and retired systems. During an incident nobody can answer
        "what else used this key?", so rotation is always partial - and the first sign
        of an unknown certificate is the outage when it expires.
      measure: |
        - An inventory of secrets and certificates is maintained and has a named owner.
        - Each entry records its consuming system, owner, purpose and (where
          applicable) expiry date.
        - The inventory is refreshed on a defined cadence, or generated automatically
          from the secret store / cluster.
        - Secrets held outside the main store (legacy systems, third-party, SaaS) are
          captured too.
      assessment: |
        - Present the inventory and its owner.
        - Sample three entries and confirm each has an accountable owner and a known consumer.
        - Show how the inventory is kept current.
      difficultyOfImplementation:
        knowledge: 3
        time: 4
        resources: 2
      usefulness: 4
      level: 3
      dependsOn:
        - No plaintext secrets in source code
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/trust-manager
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/cert-manager
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/openbao
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/external-secrets-operator
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/infisical
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/gitleaks
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/trufflehog
      tags:
        - secret-management
        - certificates
        - inventory
      references:
        samm2:
          - I-SD-B-2 # Secure Deployment: Secret Management, maturity 2
        iso27001-2017:
          - 8.1.1  # Inventory of assets
          - 10.1.2 # Key management
        iso27001-2022:
          - 5.9  # Inventory of information and other associated assets
          - 8.24 # Use of cryptography
      comments: ""
 
    Centralized secret management:
      uuid: c68f27d1-42cd-4b1e-b14c-b9950f6ee1fb
      description: |
        Application and infrastructure secrets are held in a dedicated secrets
        manager or vault, giving one governed place to store, access and audit them
        instead of scattering them across CI variables, files and wikis.
      risk:
        Secrets spread across many locations cannot be consistently controlled,
        rotated or revoked. Nobody knows where all the copies are, so a leak is hard
        to contain and rotation is incomplete.
      measure: |
        - A dedicated secrets manager / vault is the system of record for secrets.
        - Applications and pipelines retrieve secrets from it rather than local copies.
        - Ad-hoc stores (plaintext CI variables, config files, wikis) are being retired.
        - Private keys and certificates are held in the same managed store (or a managed
          CA/PKI), not scattered on hosts.
      assessment: |
        - Present the secrets manager and the services that consume it.
        - Show that a sample application retrieves its secrets from the manager.
      difficultyOfImplementation:
        knowledge: 3
        time: 3
        resources: 3
      usefulness: 5
      level: 3
      dependsOn:
        - No plaintext secrets in source code
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/hashicorp-vault
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/managing-secrets
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/openbao
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/infisical
      tags:
        - secret-management
        - vault
      references:
        samm2:
          - I-SD-B-2 # Secure Deployment: Secret Management, maturity 2
        iso27001-2017:
          - 10.1.2 # Key management
          - 9.2.4  # Management of secret authentication information
        iso27001-2022:
          - 8.24 # Use of cryptography
          - 5.17 # Authentication information
      comments: ""
 
    Access-controlled and audited secret access:
      uuid: c0576f32-929a-4d8f-9d09-16df690dd077
      description: |
        Access to each secret is least-privilege, authenticated and logged, and
        secrets are encrypted both at rest and in transit.
      risk:
        If any identity can read any secret and access is not logged, one
        compromised account exposes everything and there is no trail to scope the
        incident afterwards.
      measure: |
        - Access to secrets is granted per least privilege (identity / workload scoped).
        - Standing human read access to production secret values is minimised -
          workloads read secrets, people generally do not. Where a team retains read
          access to its own namespace, the membership is kept as small as practical.
        - Every secret access is authenticated and logged.
        - Secrets are encrypted at rest and in transit.
        - The same access control and audit logging apply to private keys and certificates.
      assessment: |
        - Show the access policy for a sample secret and that it is narrowly scoped.
        - Present secret-access logs.
        - Confirm encryption at rest and in transit for the secret store.
      difficultyOfImplementation:
        knowledge: 3
        time: 3
        resources: 2
      usefulness: 5
      level: 3
      dependsOn:
        - Centralized secret management
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/hashicorp-vault
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/openbao
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/infisical
      tags:
        - secret-management
        - access-control
      references:
        samm2:
          - I-SD-B-2 # Secure Deployment: Secret Management, maturity 2
        iso27001-2017:
          - 9.4.1  # Information access restriction
          - 12.4.1 # Event logging
          - 10.1.1 # Policy on the use of cryptographic controls
        iso27001-2022:
