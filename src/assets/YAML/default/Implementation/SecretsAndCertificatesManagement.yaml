          - 9.4.1  # Information access restriction
          - 10.1.2 # Key management
        iso27001-2022:
          - 5.16 # Identity management
          - 8.3  # Information access restriction
          - 8.24 # Use of cryptography
      comments: ""
 
    Automated secret rotation:
      uuid: e214e5ed-8f6d-48b1-af1c-82e87646c3e6
      description: |
        Secrets are rotated automatically on a defined schedule and on demand (for
        example after a staff change or suspected exposure) without service downtime.
      risk:
        Secrets that never change give an attacker who obtains one indefinite
        access. Manual rotation is so painful that it rarely happens, so credentials
        outlive the people and systems they were issued for.
      measure: |
        - Secrets are rotated automatically on a defined schedule.
        - On-demand rotation is possible and tested (e.g. after a leaver).
        - Rotation happens without downtime and consuming systems pick up new values.
        - Certificates are renewed automatically (e.g. ACME / cert-manager) well before expiry.
      assessment: |
        - Show the rotation configuration and schedule.
        - Demonstrate an on-demand rotation and that services continue to work.
      difficultyOfImplementation:
        knowledge: 3
        time: 4
        resources: 3
      usefulness: 4
      level: 4
      dependsOn:
        - Centralized secret management
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/cert-manager
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/openbao
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/hashicorp-vault
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/infisical
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/step-ca
      tags:
        - secret-management
        - certificates
        - rotation
      references:
        samm2:
          - I-SD-B-3 # Secure Deployment: Secret Management, maturity 3
        iso27001-2017:
          - 9.2.4  # Management of secret authentication information
          - 10.1.2 # Key management
        iso27001-2022:
          - 5.17 # Authentication information
          - 8.24 # Use of cryptography
      comments: ""
 
    Secret and certificate monitoring and alerting:
      uuid: 8085e678-cbc6-4cc7-b22b-963b83ee6404
      description: |
        Secrets and certificates are actively watched on two fronts: anomalous access
        is detected and alerted, and impending expiry raises an alert a defined lead
        time in advance. A tested runbook covers revocation and rotation for a
        suspected leak. Logging alone is passive - this is the activity that turns the
        audit trail into something that reaches a human in time to act.
      risk:
        Without detection and alerting, unusual secret access (mass reads, access from
        new locations) goes unnoticed until damage is done, and responders have no
        rehearsed way to revoke. On the other side, expired certificates are a leading
        cause of avoidable outages - a lapsed TLS or mTLS certificate takes a service
        down instantly, and an expired CA or code-signing certificate can break trust
        chains fleet-wide.
      measure: |
        - Anomalous secret access is detected and generates alerts.
        - Alerts fire a defined lead time before a secret or certificate expires, and
          route to an accountable owner who can act.
        - Expiry coverage includes TLS/mTLS and internal-PKI certificates and
          non-human / service credentials, not just user passwords.
        - Renewal / rotation is triggered from the expiry alert (ideally automated,
          e.g. ACME / cert-manager).
        - A revocation / rotation runbook exists for suspected leaks and is tested.
        - Application, CI and platform logs are checked for leaked secret values, and
          secrets are redacted at source where the platform allows it.
      assessment: |
        - Show the detection rules / alerts for anomalous secret access.
        - Show the configured expiry lead time, and a recent expiry alert with the
