    # ---------- Level 5: no standing secret material ----------
 
    Elimination of long-lived static secrets:
      uuid: e09c5fcf-4ba4-4a26-b731-1948badfc5a7
      description: |
        Static cloud and service keys are replaced by workload identity federation,
        and any residual static secrets are inventoried and explicitly justified.
      risk:
        Every remaining long-lived static secret is a standing liability that can
        be leaked, copied and reused indefinitely. What is not inventoried cannot be
        rotated or revoked in an incident.
      measure: |
        - Static cloud / service keys are replaced by workload identity federation.
        - Remaining static secrets are inventoried, owned and justified.
        - New long-lived static secrets require explicit exception approval.
        - Long-lived certificates are replaced by short-lived, automatically issued certificates.
      assessment: |
        - Show workloads using federation instead of static keys.
        - Present the inventory of residual static secrets with justifications.
      difficultyOfImplementation:
        knowledge: 4
        time: 4
        resources: 3
      usefulness: 4
      level: 5
      dependsOn:
        - Dynamic and short-lived secrets
        - Federated workload identity and access
