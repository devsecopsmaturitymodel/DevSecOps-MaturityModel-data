    Secretless and just-in-time credential brokering:
      uuid: b7d2c2f2-1858-49f1-aada-f0d3a855636c
      description: |
        Workloads obtain credentials just-in-time from a broker at the moment of
        use, a suspected compromise triggers automatic revocation, and there is
        minimal persistent secret material anywhere in the system.
      risk:
        Any secret that persists can eventually be found and abused. Brokering
        credentials only at the moment of use, with automatic revocation, removes
        most of the standing material an attacker could steal.
      measure: |
        - Workloads request credentials just-in-time from a broker rather than
          holding them.
        - Suspected compromise triggers automatic revocation.
        - Persistent secret material is minimized to a small, justified set.
        - Certificates are minted just-in-time with short TTLs and revoked automatically
          (short TTL / OCSP), leaving no long-lived certificate material.
        - Broker endpoints are restricted to the intended workload using a loopback or
          Unix socket and network policy; backend credentials use least privilege.
      assessment: |
        - Demonstrate a workload obtaining a just-in-time brokered credential.
        - Show an automatic revocation triggered by a simulated compromise.
        - Show that unauthorized workloads cannot reach the broker endpoint.
      difficultyOfImplementation:
        knowledge: 5
        time: 5
        resources: 5
      usefulness: 4
      level: 5
      dependsOn:
        - Elimination of long-lived static secrets
        - Secret and certificate monitoring and alerting
