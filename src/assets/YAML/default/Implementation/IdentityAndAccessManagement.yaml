    Least-privilege access baseline:
      uuid: d9dc7614-81fb-45a9-a1e0-e033755ddbed
      description: |
        Every identity - human and machine - should hold only the permissions it
        needs to do its job, and nothing more. This activity establishes a
        default-deny posture and removes shared or ambient administrative access.
      risk:
        Over-broad permissions mean a single compromised account or token can read,
        modify or destroy far more than its role requires, turning a small breach
        into a large one.
      measure: |
        - Access is default-deny; permissions are granted through defined roles.
        - No shared accounts; every action is attributable to one identity.
        - Standing administrative access is inventoried and capped (e.g. < 5 admins per system).
        - Application and pipeline service accounts are scoped to only the resources/actions
          they need (narrow IaC-defined IAM policies, minimal CI `permissions:` blocks),
          not broad admin roles.
      assessment: |
        - Present the role / permission definitions and show default-deny is in effect.
        - Present the admin inventory per critical system and show the cap is met.
        - Sample 3 identities and demonstrate their grants match their role.
        - Pick one service's IaC-defined role and show it grants only what that service actually uses.
      difficultyOfImplementation:
        knowledge: 3
        time: 3
        resources: 2
      usefulness: 5
      level: 2
      dependsOn:
        - Simple access control for systems
        - Account inventory
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/directory-service
      tags:
        - identity
        - least-privilege
      references:
        samm2:
          - O-EM-A-2 # Configuration Hardening
        iso27001-2017:
          - 9.1.1 # User registration and de-registration
        iso27001-2022:
          - 8.2  # Privileged access rights
          - 8.3  # Information access restriction
          - 5.15 # Access control
        d3f:
          - LocalAccountMonitoring
      comments: ""


    # ---------- Level 3: model, automate and assure ----------

    Use correct OAuth2/OIDC authorization flows:
      uuid: 2a2405ca-bfee-4dea-a391-dd5060cc07fa
      description: |
        Each client uses the OAuth2/OIDC flow appropriate for its type: Authorization
        Code + PKCE for user-facing apps (SPA, mobile, native), Client Credentials for
        service-to-service/machine access. Deprecated, insecure flows (Implicit Grant,
        Resource Owner Password Credentials) are not used.
      risk:
        The wrong or deprecated flow leaks tokens or credentials - Implicit Grant
        exposes tokens in the URL fragment/browser history, ROPC hands the client raw
        user passwords, and public clients without PKCE are vulnerable to
        authorization-code interception.
      measure: |
        - Each client type uses its recommended flow (Auth Code + PKCE for public/
          user-facing clients, Client Credentials for service-to-service).
        - Implicit Grant and ROPC are not used for new integrations, and existing
          usage is inventoried and being retired.
        - Redirect URIs are exact-match allow-listed, not wildcarded.
      assessment: |
        - For a sample of applications, show which flow each uses and confirm it
          matches its client type.
        - Show PKCE is enforced for public clients.
        - Show the IdP's client registrations for any Implicit/ROPC grants and, if
          present, the remediation plan.
      difficultyOfImplementation:
        knowledge: 3
        time: 2
        resources: 1
      usefulness: 4
      level: 3
      dependsOn:
        - Central identity provider for human access
      implementation: []
      tags:
        - identity
        - oauth
        - oidc
      references:
        samm2:
          - D-SR-A-2
        iso27001-2017:
          - 9.4.2
        iso27001-2022:
          - 8.5
      comments: ""

    Fine-Grained Access Controls for authentication and authorization:
      uuid: 070bb14b-e04a-4f3d-896a-a08eba7a35f9
           description: |
        Access decisions are driven by a defined, structured model rather than
        ad-hoc per-user grants: roles (RBAC) as the baseline, refined with attributes
        (ABAC) or simple policy rules (PBAC) where roles alone are too coarse. Roles,
        attributes and policies are explicitly defined and documented, not implicit
        in application code.
      risk:
        Without a structured model, grants accumulate per-user and ad-hoc and nobody
        can answer "who can do X and why"
        Everyone is able to get unauthorized access to information on systems
        or to modify information unauthorized on systems.
      measure:
        Access is restricted through defined roles (RBAC) rather than per-user grants.
        The usage of fine-grained access controls access control helps to restrict system
        access to authorized users. And enhancement is to use *attribute based access control*.
        Roles, attributes and policies are explicitly defined and documented.
      assessment: |
        - Present the role / attribute / policy definitions for a sample system.
        - Trace one access decision back to a specific role, attribute or policy rule
          rather than a hardcoded per-user check.
      difficultyOfImplementation:
        knowledge: 3
        time: 3
        resources: 2
      usefulness: 4
      level: 3
      dependsOn:
        - Least-privilege access baseline
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/directory-service
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/plugins
      tags:
        - identity
        - access-control
        - rbac
        - abac
        - pbac
      references:
        samm2:
          - O-EM-A-2 # Configuration Hardening
        iso27001-2017:
          - 9.4.1 # Information Access Restriction
        iso27001-2022:
          - 8.3 # Information Access Restriction
      comments: ""

    Automated authorization test coverage:
      uuid: 55d43b9a-ab12-4b6f-b289-23ff0cf38565
      description: |
        Automated tests assert that each role/permission boundary is enforced,
        including explicit "should be denied" cases, and run in CI on every change.
      risk:
        Without regression tests, authorization checks silently break as code
        changes (a refactor drops a check) and manual QA won't cover every
        role x endpoint combination.
      measure: |
        - A test suite covers each role against each sensitive endpoint/action.
        - Tests include negative cases (should be denied), not only allowed paths.
        - Tests run in CI and block merge on failure.
      assessment: |
        - Show the authorization test suite, including at least one negative test.
        - Show CI results proving these tests gate merges.
        - Introduce a deliberate regression and show CI catches it.
      difficultyOfImplementation:
        knowledge: 2
        time: 3
        resources: 2
      usefulness: 4
      level: 3
      dependsOn:
        - Enforce server-side authorization on every request
      implementation: []
      tags:
        - identity
        - access-control
        - testing
      references:
        samm2:
          - V-RT-A-1 # Control Verification
        iso27001-2017:
          - 14.2.8 # System Security Testing
        iso27001-2022:
          - 8.29 # Security Testing in Development and Acceptance
      comments: ""

    Automated joiner-mover-leaver provisioning:
      uuid: 582ff41d-99a6-4142-83f5-16e949422e18
      description: |
        Access is granted, changed and revoked automatically, driven from an
        authoritative source such as an HR system or the IdP, across the joiner,
        mover and leaver lifecycle.
      risk:
        Manual provisioning is slow and error-prone. Movers accumulate permissions
        they no longer need (privilege creep) and leavers retain access long after
        departure, both of which widen the attack surface.
      measure: |
        - Provisioning and de-provisioning are automated from an authoritative source.
        - Role changes trigger corresponding access changes (removing stale grants).
        - Leavers lose all access within an agreed, measured SLA.
      assessment: |
        - Show the automated provisioning pipeline and its authoritative source.
        - Present metrics on leaver de-provisioning time against the SLA.
        - Trace one recent mover and confirm stale access was removed.
      difficultyOfImplementation:
        knowledge: 3
        time: 4
        resources: 3
      usefulness: 4
      level: 3
      dependsOn:
        - Least-privilege access baseline
        - Central identity provider for human access
      implementation: []
      tags:
        - identity
        - lifecycle
      references:
        samm2:
          - O-EM-A-2 # Configuration Hardening
        iso27001-2017:
          - 9.2.1 # Conduct internal audits at planned intervals
          - 9.2.6 # Removal or adjustment of access rights
        iso27001-2022:
          - 5.16 # Identity management
          - 5.18 # Access rights
      comments: ""

    # ---------- Level 4: eliminate standing privilege ----------

    Segregation of duties for critical actions:
      uuid: 879e1f8f-61db-4af5-bb9b-07f21ac417b8
      description: |
        Conflicting responsibilities are split across different identities so that
        no single person can both introduce and approve a sensitive change.
      risk:
        If one identity can author and also approve or deploy a change, a mistake
        or a malicious insider can push unreviewed changes straight to production,
        and audit trails can be altered by the same actor.
      measure: |
        - Conflicting duty pairs are identified (e.g. author vs approver,
          deploy vs approve-to-prod, security audit vs infrastructure admin).
        - Each pair is enforced technically (branch protection, maker-checker,
          separate accounts / roles), not just by policy.
      assessment: |
        - Present the documented list of conflicting duty pairs.
        - Demonstrate enforcement for at least one pair (e.g. a pull request cannot
          be approved by its author; a production deploy requires a second approver).
      difficultyOfImplementation:
        knowledge: 3
        time: 3
        resources: 2
      usefulness: 4
      level: 4
      dependsOn:
        - Least-privilege access baseline
      implementation: []
      tags:
        - identity
        - segregation-of-duties
      references:
        samm2:
          - O-EM-A-2 # Configuration Hardening
        iso27001-2017:
          - 6.1.2 # Segregation of duties
        iso27001-2022:
          - 5.3 # Segregation of duties
          - 8.2 # Privileged access rights
      comments: ""

    Workload and machine identity:
      uuid: 9f83087c-7d97-4715-a2ff-10d3f167c3cc
      description: |
        Non-human access (services, pipelines, workloads) uses short-lived,
        cryptographically verifiable identities - for example OIDC federation or
        SPIFFE/SVID - instead of long-lived shared keys.
      risk:
        Long-lived machine credentials are copied into pipelines, images and config,
        rarely rotated and hard to attribute. A single leaked static key can grant
        persistent access with no expiry.
      measure: |
        - Workloads authenticate with short-lived, verifiable identities.
        - Long-lived static machine credentials are being actively retired.
        - Each workload identity is attributable and least-privileged.
      assessment: |
        - Show a workload authenticating via federated / short-lived identity.
        - Present the inventory of remaining static machine credentials and the
          plan to retire them.
      difficultyOfImplementation:
        knowledge: 4
        time: 4
        resources: 3
      usefulness: 4
      level: 4
      dependsOn:
        - Least-privilege access baseline
      implementation: []
      tags:
        - identity
        - workload-identity
      references:
        samm2:
          - O-EM-A-3 # Configuration Hardening
        iso27001-2017:
          - 9.2.1 # Conduct internal audits at planned intervals
        iso27001-2022:
          - 5.16 # Identity management
          - 8.3  # Information access restriction
      comments: ""

    Just-in-time privileged access:
      uuid: d42995ac-f4e5-4fa6-b01a-83a0d35ef3b1
      description: |
        Privileged access is requested on demand, time-boxed, approved and
        automatically revoked, so there is zero standing administrative access for
        day-to-day work.
      risk:
        Standing admin rights are always-on targets. If such an account is
        compromised, the attacker inherits persistent high privilege. Removing
        standing access shrinks both the window and the blast radius.
      measure: |
        - Privileged access is granted just-in-time, time-boxed, and auto-revoked.
        - Requests require approval and produce an audit record.
        - Standing admin access for routine work is eliminated or reduced to a
          justified, minimal break-glass set.
      assessment: |
        - Demonstrate a JIT elevation request, approval and automatic expiry.
        - Show that routine admin roles carry no standing membership.
        - Present the break-glass account list and its controls.
        - Show developers requesting prod access for debugging go through the JIT
          flow rather than holding standing prod credentials.
      difficultyOfImplementation:
        knowledge: 4
        time: 4
        resources: 3
      usefulness: 5
      level: 4
      dependsOn:
        - Least-privilege access baseline
        - MFA for admins
      implementation: []
      tags:
        - identity
        - privileged-access
      references:
        samm2:
          - O-EM-A-3 #Configuration Hardening
        iso27001-2017:
          - 9.2.3 # Management of privileged access rights
        iso27001-2022:
          - 8.2 # Privileged access rights
          - 8.3 # Information access restriction
      comments: ""

    Periodic access recertification:
      uuid: 7f216405-fb84-4c84-a495-6b8f4958834a
      description: |
        Access rights, especially privileged ones, are reviewed and re-attested by
        an accountable owner on a defined cadence, and access that is no longer
        justified is removed.
      risk:
        Without regular review, permissions granted for one-off needs become
        permanent. Over time entitlements drift far from what people actually need,
        undermining least privilege and segregation of duties.
      measure: |
        - Access reviews run on a defined cadence (e.g. quarterly for privileged access).
        - Owners re-attest each grant; unconfirmed or unused access is revoked.
        - Reviews are recorded and auditable.
      assessment: |
        - Present the most recent recertification campaign and its outcomes.
        - Show evidence that flagged access was actually revoked.
        - Show reviews cover your application's own service-account permissions,
          not just human accounts.
      difficultyOfImplementation:
        knowledge: 2
        time: 3
        resources: 3
      usefulness: 4
      level: 4
      dependsOn:
        - Least-privilege access baseline
        - Automated joiner-mover-leaver provisioning
      implementation: []
      tags:
        - identity
        - access-review
      references:
        samm2:
          - O-EM-A-2 # Configuration Hardening
        iso27001-2017:
          - 9.2.5 # Review of user access rights
        iso27001-2022:
          - 5.18 # Access rights
          - 8.2  # Privileged access rights
      comments: ""

    # ---------- Level 5: continuous verification & policy as code ----------

    Externalized policy-as-code authorization:
      uuid: 3153c507-8e40-44c5-9957-fba236a80a5a
      description: |
        Authorization decisions are externalized to a central decision point (a
        policy engine such as OPA/Rego) rather than scattered across each service.
        Policies are managed as version-controlled, tested code and every decision
        is logged, giving consistent, auditable enforcement across all services.
      risk:
        When each service implements its own authorization logic, rules drift apart,
        are inconsistently enforced and cannot be reviewed or changed centrally. A
        gap in one service becomes an unseen hole, and there is no single audit trail
        of who was allowed to do what.
      measure: |
        - A central policy engine (e.g. OPA) evaluates authorization decisions for
          multiple services rather than each service deciding in isolation.
        - Policies are version-controlled and covered by automated tests.
        - Authorization decisions are logged and auditable.
      assessment: |
        - Show the policy engine and a sample policy under version control with tests.
        - Show at least two services delegating decisions to the central engine.
        - Present authorization decision logs.
      difficultyOfImplementation:
        knowledge: 5
        time: 4
        resources: 3
      usefulness: 3
      level: 5
      dependsOn:
        - Fine-Grained Access Controls for authentication and authorization
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/open-policy-agent
      tags:
        - identity
        - access-control
        - pbac
        - policy-as-code
      references:
        samm2:
          - O-EM-A-3
        iso27001-2017:
          - 9.4.1
        iso27001-2022:
          - 8.3
      comments: ""

    Continuous and risk-adaptive access:
      uuid: eba1a951-df6b-4c02-86c5-0370654aa930
      description: |
        Access decisions are evaluated continuously against device posture, context
        and risk signals, and segregation-of-duties conflicts are detected
        automatically. Builds on policy-based access control to make decisions
        dynamic rather than static.
      risk:
        Access granted once and never re-evaluated ignores changing risk - a
        compromised device or anomalous behaviour keeps its access. Manual SoD
        checks miss conflicts that emerge as roles change.
      measure: |
        - Access is continuously evaluated using device, context and risk signals.
        - Policy decisions incorporate real-time risk (step-up or denial on anomaly).
        - Segregation-of-duties conflicts are detected and flagged automatically.
      assessment: |
        - Demonstrate a risk-based access decision (e.g. step-up or denial on
          anomalous context).
        - Show automated SoD conflict detection output and how conflicts are resolved.
      difficultyOfImplementation:
        knowledge: 5
        time: 5
        resources: 4
      usefulness: 4
      level: 5
      dependsOn:
        - Just-in-time privileged access
        - Fine-Grained Access Controls for authentication and authorization
        - Periodic access recertification
      implementation: []
      tags:
        - identity
        - zero-trust
      references:
        samm2:
          - O-EM-A-3 # Configuration Hardening
        iso27001-2017:
          - 9.4.1 # Information Access Restriction
        iso27001-2022:
          - 8.2  # Privileged access rights
          - 8.16 # Monitoring activities
      comments: ""
