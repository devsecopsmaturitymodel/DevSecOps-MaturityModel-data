    Enforce server-side authorization on every request:
      uuid: 2244983e-5279-4a6c-b594-155a5d26ebc2
      description: |
        Every request that reads or changes data is checked against the caller's
        role/ownership on the server, deny-by-default. Hiding a button in the UI or
        trusting a client-supplied role is not authorization.
      risk:
        An attacker can access or modify data/actions beyond their role simply by
        changing an ID, calling an API directly, or forging a client-side flag
        (IDOR / broken access control), since the server never re-checks the client's claim.
      measure: |
        - Authorization is checked server-side on every state-changing and data-returning endpoint.
        - Checks are centralized (middleware / policy layer), not duplicated ad-hoc per handler.
        - Access is deny-by-default; missing a check fails closed, not open.
      assessment: |
        - Pick 3 endpoints and show the server-side authorization check for each.
        - Attempt an IDOR test (swap an ID/role in the request) and show it is rejected.
        - Show the authorization logic lives in one reusable place, not copy-pasted.
      difficultyOfImplementation:
        knowledge: 2
        time: 2
        resources: 1
      usefulness: 5
      level: 1
      implementation: []
      tags:
        - identity
        - access-control
      references:
        samm2:
          - D-SR-A-1 # Software Requirements
        iso27001-2017:
          - 9.4.1 # Information Access Restriction
        iso27001-2022:
          - 8.3 # Information Access Restriction
      comments: ""

    # ---------- Level 2: consolidate and structure ----------

    Account inventory:
      uuid: 7fe91f4d-1228-46e3-84ca-47b1d1cb8e1b
      description: |
        A current, owned inventory of all accounts exists, covering both human and
        non-human (service / machine) identities. You cannot secure or right-size
        access you cannot see.
      risk:
        Without an inventory, orphaned accounts, forgotten service accounts and
        shared logins accumulate unnoticed and become a prime target for attackers
        and a blind spot during incident response.
      measure: |
        - An inventory of human and non-human accounts is maintained and has a named owner.
        - Each account maps to a responsible person or system and its purpose.
        - The inventory is refreshed on a defined cadence or generated automatically.
      assessment: |
        - Present the account inventory and its owner.
        - Sample entries and confirm each has an accountable owner and purpose.
      difficultyOfImplementation:
        knowledge: 2
        time: 3
        resources: 2
      usefulness: 4
      level: 2
      implementation: []
      tags:
        - identity
        - inventory
      references:
        samm2:
          - O-EM-A-1
        iso27001-2017:
          - 9.2.1
        iso27001-2022:
          - 5.16 # Identity management
          - 8.2  # Privileged access rights
      comments: ""

    Central identity provider for human access:
      uuid: 6ffb2c07-8fca-4bc1-a219-1d1944a3bbac
      description: |
        All human access to systems and applications is brokered through a single
        identity provider (IdP) with single sign-on, rather than per-system local
        accounts. This creates one place to enforce policy, disable a leaver, and
        audit access.
      risk:
        Local, per-system accounts fragment control. Leavers keep access nobody
        remembers to revoke, password policy is inconsistent, and there is no single
        audit trail, so a compromised credential is hard to detect and contain.
      measure: |
        - Human access to systems and applications is federated through a central IdP / SSO.
        - Local accounts are the documented exception, not the norm, and are inventoried.
        - Disabling an identity in the IdP removes access across federated systems.
      assessment: |
        - Present the IdP and the list of federated applications.
        - Show that a sample of critical systems authenticate via the IdP.
        - Demonstrate that disabling a test identity removes its access.
        - Show your application delegates login to the IdP via OIDC/SAML rather than
          a custom login form.
      difficultyOfImplementation:
        knowledge: 3
        time: 3
        resources: 2
      usefulness: 4
      level: 2
      dependsOn:
        - Simple access control for systems
      implementation:
        - $ref: src/assets/YAML/default/implementations.yaml#/implementations/directory-service
      tags:
        - identity
        - sso
      references:
        samm2:
          - O-EM-A-1 # Configuration Hardening
        iso27001-2017:
          - 9.2.1 # User registration and de-registration
          - 9.2.4 # Management of secret authentication information
        iso27001-2022:
          - 5.16 # Identity management
          - 5.17 # Authentication information
      comments: ""

